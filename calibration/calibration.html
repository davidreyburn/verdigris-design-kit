<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verdigris · Calibration</title>
<style>
/* ══════════════════════════════════════════════════════════════
   CHROME — deliberately neutral.
   Uses only Verdigris NEUTRALS (bg / bone / dim) plus teal as the
   instrument accent. Green is withheld from the chrome so it stays
   unbiased during the territory bake-off.
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#161614; --bg-dim:#111110; --bg-hi:#1e1d1b; --bg-sel:#2c2b28;
  /* --dim is decoration/borders only (2.4:1 on bg-dim — fails AA for text).
     --dim2 is the secondary TEXT colour: 5.2:1 on bg-dim, 5.6:1 on bg. */
  --dim:#524e48; --dim2:#8B8478; --bone:#D0CAB8; --bone-b:#E8E2D0; --white:#F0EDE4;
  --green:#44BB44; --orange:#C4834A; --teal:#4AACA4; --blue:#5B8DB8;
  --purple:#8855BB; --lime:#AAFF00; --red:#CC5555;
  --line:#2c2b28; --line-soft:#211f1d;

  --f-sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-tech:Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif;
  --f-serif:"Sitka Text",Constantia,Georgia,"Times New Roman",serif;
  --f-serif-d:"Sitka Display",Constantia,Georgia,serif;
  --f-mono:"Cascadia Code","Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
  --f-hum:Corbel,Candara,"Segoe UI",system-ui,sans-serif;

  --rail:264px;
  --ease:cubic-bezier(.2,.6,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--bone);
  font-family:var(--f-sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--bg-sel);color:var(--white)}
a{color:var(--teal)}

.mono{font-family:var(--f-mono)}
.lbl{
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--dim2);
}

/* ── shell ─────────────────────────────────────────────── */
#shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

#rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:var(--bg-dim);border-right:1px solid var(--line);
  padding:22px 0 28px;display:flex;flex-direction:column;
}
#rail::-webkit-scrollbar{width:7px}
#rail::-webkit-scrollbar-thumb{background:var(--bg-sel)}
.rail-head{padding:0 20px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:12px}
.rail-title{font-family:var(--f-mono);font-size:13px;color:var(--bone-b);letter-spacing:.06em}
.rail-title b{color:var(--teal);font-weight:400}
.rail-sub{font-size:11px;color:var(--dim2);margin-top:5px;line-height:1.45}

.nav-item{
  display:flex;gap:11px;align-items:baseline;width:100%;text-align:left;
  padding:7px 20px;background:none;border:0;cursor:pointer;
  color:var(--dim2);font-family:var(--f-sans);font-size:13.5px;
  border-left:2px solid transparent;transition:color .15s,background .15s;
}
.nav-item:hover{color:var(--bone);background:#00000030}
.nav-item.on{color:var(--bone-b);border-left-color:var(--teal);background:#00000040}
.nav-item .n{font-family:var(--f-mono);font-size:10.5px;color:var(--dim2);min-width:16px}
.nav-item.on .n{color:var(--teal)}
.nav-item .ct{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim2)}
.nav-item.done .ct{color:var(--green)}

.rail-foot{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--line-soft)}
.bar{height:3px;background:var(--bg-sel);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s var(--ease)}
.rail-foot .lbl{display:flex;justify-content:space-between}
.mini{
  margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;
}
.mini button{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--dim2);padding:4px 7px;cursor:pointer;
}
.mini button:hover{color:var(--bone);border-color:var(--dim)}

/* ── main ──────────────────────────────────────────────── */
#main{padding:0 0 120px;min-width:0}
.wrap{max-width:820px;margin:0 auto;padding:0 40px}

.sec-head{padding:64px 0 30px;border-bottom:1px solid var(--line);margin-bottom:38px}
.sec-num{font-family:var(--f-mono);font-size:11px;color:var(--teal);letter-spacing:.18em;margin-bottom:12px}
.sec-title{font-family:var(--f-tech);font-size:40px;line-height:1.05;font-weight:400;
  letter-spacing:.005em;color:var(--white);margin:0 0 14px}
.sec-lede{font-size:15.5px;color:var(--bone);max-width:62ch;line-height:1.65;margin:0}
.sec-lede em{color:var(--bone-b);font-style:italic}

/* ── question block ────────────────────────────────────── */
.q{padding:30px 0;border-bottom:1px solid var(--line-soft)}
.q:last-child{border-bottom:0}
.q-top{display:flex;gap:12px;align-items:baseline;margin-bottom:6px}
.q-id{font-family:var(--f-mono);font-size:10px;color:var(--dim2);padding-top:3px;min-width:34px}
.q-label{font-size:17px;color:var(--bone-b);line-height:1.45;font-weight:500;margin:0}
.q-help{font-size:13.5px;color:var(--dim2);line-height:1.6;margin:6px 0 0 46px;max-width:64ch}
.q-help code{font-family:var(--f-mono);font-size:12px;color:var(--orange);background:#0000004d;padding:1px 4px}
.q-body{margin:16px 0 0 46px}
@media(max-width:820px){.q-help,.q-body{margin-left:0}}

/* inputs */
textarea,input[type=text]{
  width:100%;background:var(--bg-dim);border:1px solid var(--line);color:var(--bone-b);
  font-family:var(--f-sans);font-size:14.5px;line-height:1.6;padding:11px 13px;resize:vertical;
}
textarea:focus,input[type=text]:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal)}
textarea::placeholder,input::placeholder{color:#6B665E}
select{
  background:var(--bg-dim);border:1px solid var(--line);color:var(--bone-b);
  font-family:var(--f-mono);font-size:12.5px;padding:6px 8px;
}
select:focus{outline:2px solid var(--teal);outline-offset:-1px}

/* scale */
.scale{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.scale-pole{font-family:var(--f-mono);font-size:11px;color:var(--dim2);white-space:nowrap;flex-shrink:0}
.scale-track{display:flex;gap:3px}
.scale-track button{
  width:38px;height:34px;background:var(--bg-dim);border:1px solid var(--line);
  color:var(--dim2);font-family:var(--f-mono);font-size:11.5px;cursor:pointer;transition:all .12s;
}
.scale-track button:hover{border-color:var(--dim);color:var(--bone)}
.scale-track button.on{background:var(--teal);border-color:var(--teal);color:#0d1a19;font-weight:600}

/* choice list */
.opts{display:flex;flex-direction:column;gap:1px}
.opt{
  display:flex;gap:12px;padding:12px 14px;background:var(--bg-dim);
  border:1px solid var(--line-soft);cursor:pointer;transition:all .12s;align-items:flex-start;
}
.opt:hover{border-color:var(--dim);background:var(--bg-hi)}
.opt.on{border-color:var(--teal);background:#4aaca40f}
.opt .box{
  width:14px;height:14px;border:1px solid var(--dim);flex-shrink:0;margin-top:4px;position:relative;
}
.opt.multi .box{border-radius:0}
.opt:not(.multi) .box{border-radius:50%}
.opt.on .box{border-color:var(--teal)}
.opt.on .box::after{
  content:"";position:absolute;inset:3px;background:var(--teal);
}
.opt:not(.multi).on .box::after{border-radius:50%}
.opt .txt{min-width:0;display:block}
.opt .t{display:block;font-size:14.5px;color:var(--bone-b);line-height:1.45}
.opt .d{display:block;font-size:12.5px;color:var(--dim2);line-height:1.55;margin-top:3px}
.opt .d code{font-family:var(--f-mono);color:var(--orange);font-size:11.5px}

/* specimen grid */
.spgrid{display:grid;gap:14px}
.spgrid.c2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.spgrid.c1{grid-template-columns:1fr}
.spwrap{border:1px solid var(--line);background:var(--bg-dim);transition:border-color .15s}
.spwrap:hover{border-color:var(--dim)}
.spwrap.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.sphead{
  display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;
}
.sphead .box{width:13px;height:13px;border:1px solid var(--dim);border-radius:50%;position:relative;flex-shrink:0}
.spwrap.on .sphead .box{border-color:var(--teal)}
.spwrap.on .sphead .box::after{content:"";position:absolute;inset:3px;background:var(--teal);border-radius:50%}
.sphead .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--bone)}
.spwrap.on .sphead .k{color:var(--bone-b)}
.sphead .tag{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;color:var(--dim2);letter-spacing:.06em}
.spnote{font-size:12px;color:var(--dim2);padding:8px 12px 0;line-height:1.5}
.spstage{padding:18px;overflow:hidden}

/* bake-off card */
.bo{border:1px solid var(--line);background:var(--bg-dim);margin-bottom:16px}
.bo-head{padding:13px 15px;border-bottom:1px solid var(--line)}
.bo-name{font-family:var(--f-tech);font-size:19px;color:var(--white);letter-spacing:.01em}
.bo-def{font-size:13px;color:var(--bone);margin-top:5px;line-height:1.55;max-width:70ch}
.bo-mine{font-size:11.5px;color:var(--dim2);margin-top:7px;line-height:1.5;font-style:italic}
.bo-foot{padding:13px 15px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
.bo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bo-row .lbl{min-width:76px}

/* map table */
.maptab{width:100%;border-collapse:collapse;font-size:13px}
.maptab th{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim2);text-align:left;padding:0 10px 8px 0;font-weight:400;
}
.maptab td{padding:5px 10px 5px 0;border-top:1px solid var(--line-soft)}
.swatch{display:inline-flex;align-items:center;gap:9px;font-family:var(--f-mono);font-size:12px;color:var(--bone)}
.swatch i{width:15px;height:15px;display:block;flex-shrink:0}
.swatch em{color:var(--dim2);font-style:normal;font-size:10.5px}

/* section footer nav */
.secnav{display:flex;gap:10px;margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}
.btn{
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--bone);padding:11px 20px;cursor:pointer;
  transition:all .14s;
}
.btn:hover{border-color:var(--dim);background:var(--bg-hi)}
.btn.pri{border-color:var(--teal);color:var(--teal)}
.btn.pri:hover{background:var(--teal);color:#0d1a19}
.btn:disabled{opacity:.3;cursor:default}
.spacer{flex:1}

/* intro */
.intro-rule{height:1px;background:var(--line);margin:34px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:9px 18px;font-size:14px;margin:24px 0}
.kv dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);padding-top:3px}
.kv dd{margin:0;color:var(--bone)}
.rules{list-style:none;padding:0;margin:22px 0;counter-reset:r}
.rules li{
  counter-increment:r;position:relative;padding:0 0 0 34px;margin-bottom:14px;
  font-size:14.5px;line-height:1.6;color:var(--bone);
}
.rules li::before{
  content:counter(r,decimal-leading-zero);position:absolute;left:0;top:1px;
  font-family:var(--f-mono);font-size:10.5px;color:var(--teal);letter-spacing:.06em;
}
.rules b{color:var(--bone-b);font-weight:600}
.warn{
  border-left:2px solid var(--orange);padding:2px 0 2px 16px;margin:26px 0;
  font-size:14px;color:var(--bone);line-height:1.65;
}
.warn b{color:var(--orange);font-weight:500}

/* output */
.outbox{
  background:var(--bg-dim);border:1px solid var(--line);padding:16px;
  font-family:var(--f-mono);font-size:11.5px;line-height:1.65;color:var(--bone);
  white-space:pre-wrap;max-height:460px;overflow:auto;
}
.outbox::-webkit-scrollbar{width:8px}
.outbox::-webkit-scrollbar-thumb{background:var(--bg-sel)}
.tabs{display:flex;gap:1px;margin-bottom:0}
.tabs button{
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--bg-dim);border:1px solid var(--line);border-bottom:0;color:var(--dim2);
  padding:9px 15px;cursor:pointer;
}
.tabs button.on{color:var(--teal);background:var(--bg-hi)}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin:20px 0 28px}
.stat div{display:flex;flex-direction:column;gap:3px}
.stat b{font-family:var(--f-mono);font-size:26px;color:var(--white);font-weight:400;line-height:1}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);
  background:var(--teal);color:#0d1a19;font-family:var(--f-mono);font-size:11.5px;
  letter-spacing:.09em;text-transform:uppercase;padding:11px 22px;
  transition:transform .3s var(--ease);z-index:99;
}
.toast.on{transform:translate(-50%,0)}

@media(max-width:900px){
  #shell{grid-template-columns:1fr}
  #rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .wrap{padding:0 22px}
  .sec-title{font-size:31px}
}

/* ══════════════════════════════════════════════════════════════
   SPECIMENS — each carries its own complete visual language.
   ══════════════════════════════════════════════════════════════ */
.sp{font-size:14px;line-height:1.55}
.sp *{box-sizing:border-box}

/* T1 · Cybernetic Minimalism */
.t-cyb{background:#0e0e0d;padding:22px;font-family:var(--f-tech);color:#c9c4b6}
.t-cyb .e{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.22em;color:#5d5952;
  display:flex;justify-content:space-between;border-bottom:1px solid #24231f;padding-bottom:7px}
.t-cyb .e span:last-child{color:#4AACA4}
.t-cyb h4{font-size:23px;font-weight:400;letter-spacing:.01em;margin:15px 0 0;color:#EDE9DE}
.t-cyb p{font-size:12.5px;line-height:1.62;color:#8e8880;margin:9px 0 0;max-width:44ch}
.t-cyb .m{display:flex;gap:0;margin-top:17px;border-top:1px solid #24231f;padding-top:9px}
.t-cyb .m div{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;color:#5d5952;
  padding-right:20px;margin-right:20px;border-right:1px solid #24231f}
.t-cyb .m div:last-child{border:0}
.t-cyb .m b{display:block;color:#c9c4b6;font-weight:400;margin-top:3px;letter-spacing:.05em}

/* T2 · Academic Cyberpunk */
.t-aca{background:#141312;padding:22px;font-family:var(--f-serif);color:#cfc9b9}
.t-aca .e{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;color:#C4834A;text-transform:uppercase}
.t-aca h4{font-family:var(--f-serif-d);font-size:26px;font-weight:400;margin:11px 0 0;color:#F0EDE4;line-height:1.15}
.t-aca .cols{display:grid;grid-template-columns:1fr 118px;gap:20px;margin-top:12px}
.t-aca p{font-size:14px;line-height:1.68;margin:0;color:#bdb6a6}
.t-aca p sup{color:#4AACA4;font-family:var(--f-mono);font-size:9px;vertical-align:super}
.t-aca .marg{font-family:var(--f-mono);font-size:9.5px;line-height:1.6;color:#65605a;
  border-left:1px solid #2b2926;padding-left:11px}
.t-aca .rule{height:1px;background:#2b2926;margin:15px 0 9px}
.t-aca .m{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:#65605a}

/* T3 · Prismatic Instrument */
.t-pri{background:#0f1012;padding:22px;font-family:var(--f-hum);color:#c8c8cc;position:relative;overflow:hidden}
.t-pri::before{content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,#4AACA4,#5B8DB8 34%,#8855BB 66%,#C4834A)}
.t-pri .e{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;
  background:linear-gradient(90deg,#4AACA4,#8855BB);-webkit-background-clip:text;
  background-clip:text;color:transparent;text-transform:uppercase}
.t-pri h4{font-size:24px;font-weight:300;letter-spacing:-.01em;margin:12px 0 0;color:#F2F1F4}
.t-pri p{font-size:13px;line-height:1.65;color:#8d8d95;margin:9px 0 0;max-width:46ch}
.t-pri .chips{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}
.t-pri .chips i{font-family:var(--f-mono);font-size:9px;letter-spacing:.13em;font-style:normal;
  padding:4px 9px;border:1px solid;background:#ffffff06}
.t-pri .chips i:nth-child(1){border-color:#4AACA470;color:#4AACA4}
.t-pri .chips i:nth-child(2){border-color:#5B8DB870;color:#5B8DB8}
.t-pri .chips i:nth-child(3){border-color:#8855BB70;color:#a06fd4}
.t-pri .chips i:nth-child(4){border-color:#C4834A70;color:#C4834A}

/* T4 · Black Box */
.t-blk{background:#0a0a09;padding:22px;font-family:var(--f-mono);color:#b8b3a6}
.t-blk .e{font-size:9.5px;letter-spacing:.18em;color:#514d47}
.t-blk h4{font-size:17px;font-weight:400;letter-spacing:.02em;margin:13px 0 0;color:#E8E2D0;
  display:inline-block;position:relative;padding:3px 9px;border:1px solid #2e2c28}
.t-blk h4::before,.t-blk h4::after{content:"";position:absolute;width:6px;height:6px;border:1px solid #44BB44}
.t-blk h4::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.t-blk h4::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.t-blk p{font-size:11.5px;line-height:1.72;color:#7a7569;margin:13px 0 0;max-width:52ch}
.t-blk .red{background:#2a2825;color:transparent;user-select:none;padding:0 3px;
  transition:color .25s,background .25s}
.t-blk:hover .red{background:#1a1917;color:#7a7569}
.t-blk .m{margin-top:15px;font-size:9.5px;letter-spacing:.14em;color:#514d47}
.t-blk .m b{color:#44BB44;font-weight:400}

/* T5 · Signal Lab */
.t-sig{background:#0d0f0e;padding:22px;font-family:var(--f-tech);color:#bfc4bf;position:relative}
.t-sig .grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(#1c211e 1px,transparent 1px),linear-gradient(90deg,#1c211e 1px,transparent 1px);
  background-size:22px 22px}
.t-sig .in{position:relative}
.t-sig .e{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;color:#44BB44;
  display:flex;align-items:center;gap:8px}
.t-sig .e::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#44BB4460,transparent)}
.t-sig h4{font-size:22px;font-weight:400;margin:13px 0 0;color:#EDF0EC;letter-spacing:.01em}
.t-sig p{font-size:12.5px;line-height:1.6;color:#868b86;margin:8px 0 0;max-width:46ch}
.t-sig svg{display:block;margin-top:14px;width:100%;height:38px}
.t-sig .m{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:#5a605a;margin-top:8px;
  display:flex;justify-content:space-between}
.t-sig .m b{color:#AAFF00;font-weight:400}

/* T6 · Verdigris Native */
.t-vrd{background:#161614;padding:22px;font-family:var(--f-sans);color:#D0CAB8}
.t-vrd .e{font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;color:#C4834A;text-transform:uppercase}
.t-vrd h4{font-size:23px;font-weight:500;margin:12px 0 0;color:#F0EDE4;letter-spacing:-.005em}
.t-vrd p{font-size:13.5px;line-height:1.65;color:#a49e90;margin:9px 0 0;max-width:48ch}
.t-vrd p b{color:#D0CAB8;font-weight:500}
.t-vrd .m{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;align-items:center}
.t-vrd .m i{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;font-style:normal;

   STATE

const KEY='verdigris-calibration-v1';
let A = {};
let cur = 0;

let storageOK=true;
function load(){ try{ const r=localStorage.getItem(KEY); if(r) A=JSON.parse(r)||{}; }catch(e){ A={}; } }
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(A)); if(!storageOK){storageOK=true;flagStorage();} }
  catch(e){ if(storageOK){ storageOK=false; flagStorage(); } }
}
function flagStorage(){
  let el=document.getElementById('nosave');
  if(storageOK){ if(el) el.remove(); return; }
  if(el) return;
  el=document.createElement('div');
  el.id='nosave';
  el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:200;background:var(--red);color:#1a0c0c;'+
    'font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;padding:9px 16px;text-align:center';
  el.textContent='AUTOSAVE UNAVAILABLE — this browser is blocking local storage. '+
    'Serve the file over http://localhost instead of opening it directly, or export from §Output before closing.';
  document.body.appendChild(el);
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),1700); }

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function allQs(){ return SECTIONS.filter(s=>s.qs).flatMap(s=>s.qs.map(q=>({s,q}))); }
function answered(q){
  if(q.type==='bakeoff'){ const s=A[q.id+'.score']; return s!==undefined&&s!==null; }
  const v=A[q.id];
  if(v===undefined||v===null) return false;
  if(typeof v==='string') return v.trim()!=='';
  if(Array.isArray(v)) return v.length>0;
  if(typeof v==='object') return Object.values(v).some(x=>x!==''&&x!==undefined&&x!==null);
  return true;
}
function required(q){ return !q.optional; }
function secStats(s){
  if(!s.qs) return null;
  const r=s.qs.filter(required);
  return {done:r.filter(answered).length, total:r.length};
}

   RENDER — questions

function qHTML(q,i){
  const id=q.id;
  let body='';
  switch(q.type){

  case 'prose':
    body=`<textarea data-q="${id}" rows="${q.rows||3}" placeholder="${esc(q.ph||'')}">${esc(A[id]||'')}</textarea>`;
    break;

  case 'short':
    body=`<input type="text" data-q="${id}" placeholder="${esc(q.ph||'')}" value="${esc(A[id]||'')}">`;
    break;

  case 'scale7': {
    const v=A[id];
    let btns='';
    for(let n=1;n<=7;n++) btns+=`<button data-scale="${id}" data-v="${n}" class="${v==n?'on':''}">${n}</button>`;
    body=`<div class="scale"><span class="scale-pole">${esc(q.poles[0])}</span>
      <div class="scale-track">${btns}</div>
      <span class="scale-pole">${esc(q.poles[1])}</span></div>`;
    break; }

  case 'choice': {
    const v=A[id];
    body=`<div class="opts">`+q.opts.map(o=>
      `<label class="opt ${v===o.v?'on':''}" data-opt="${id}" data-v="${o.v}">
        <span class="box"></span><span class="txt"><span class="t">${o.t}</span>${o.d?`<span class="d">${o.d}</span>`:''}</span>
      </label>`).join('')+`</div>`;
    break; }

  case 'multi': {
    const v=A[id]||[];
    body=`<div class="opts">`+q.opts.map(o=>
      `<label class="opt multi ${v.includes(o.v)?'on':''}" data-multi="${id}" data-v="${o.v}">
        <span class="box"></span><span class="txt"><span class="t">${o.t}</span>${o.d?`<span class="d">${o.d}</span>`:''}</span>
      </label>`).join('')+`</div>`;
    break; }

  case 'specimen': {
    const v=A[id];
    body=`<div class="spgrid c${q.cols||2}">`+q.opts.map(o=>
      `<div class="spwrap ${v===o.v?'on':''}">
        <div class="sphead" data-opt="${id}" data-v="${o.v}">
          <span class="box"></span><span class="k">${o.k}</span>${o.tag?`<span class="tag">${o.tag}</span>`:''}
        </div>
        <div class="spstage">${o.html}</div>
        ${o.note?`<div class="spnote">${o.note}</div><div style="height:12px"></div>`:''}
      </div>`).join('')+`</div>`;
    break; }

  case 'bakeoff': {
    const sc=A[id+'.score'], note=A[id+'.steal']||'';
    let btns='';
    for(let n=1;n<=5;n++) btns+=`<button data-scale="${id}.score" data-v="${n}" class="${sc==n?'on':''}">${n}</button>`;
    return `<div class="q" id="q-${id}">
      <div class="bo">
        <div class="bo-head">
          <div class="bo-name">${q.name}</div>
          <div class="bo-def">${q.def}</div>
          <div class="bo-mine">${q.mine}</div>
        </div>
        <div class="spstage">${TERRITORY[q.key]}</div>
        <div class="bo-foot">
          <div class="bo-row"><span class="lbl">Fit 1–5</span>
            <div class="scale-track">${btns}</div>
            <span class="scale-pole" style="margin-left:4px">${q.tag}</span></div>
          <div class="bo-row" style="align-items:flex-start">
            <span class="lbl" style="padding-top:9px">Steal</span>
            <textarea data-q="${id}.steal" rows="2" style="flex:1;min-width:220px"
              placeholder="The one move worth keeping — or nothing.">${esc(note)}</textarea></div>
        </div>
      </div></div>`; }

  case 'map': {
    const v=A[id]||{};
    body=`<table class="maptab"><thead><tr><th style="width:150px">Colour</th><th>Web job</th></tr></thead><tbody>`+
      q.rows.map(r=>`<tr>
        <td><span class="swatch"><i style="background:${r.hex}"></i>${r.n} <em>${r.hex}</em></span></td>
        <td><select data-map="${id}" data-k="${r.v}">${
          q.cols.map(c=>`<option value="${esc(c.v)}" ${v[r.v]===c.v?'selected':''}>${esc(c.t)}</option>`).join('')
        }</select></td></tr>`).join('')+`</tbody></table>`;
    break; }
  }

  const num = q.optional?'○':String(i).padStart(2,'0');
  return `<div class="q" id="q-${id}">
    <div class="q-top"><span class="q-id">${num}</span><p class="q-label">${q.label}</p></div>
    ${q.help?`<div class="q-help">${q.help}</div>`:''}
    <div class="q-body">${body}</div>
  </div>`;
}

/* Token prefix, from the naming answer in §08. */
function p0(){
  const p = A['cp-naming']==='dr'?'dr':A['cp-naming']==='chv'?'chv':A['cp-naming']==='semantic'?'':'vd';
  return p?'--'+p+'-':'--';
}

function deriveTokens(){
  const L=[]; const p = A['cp-naming']==='dr'?'dr':A['cp-naming']==='chv'?'chv':A['cp-naming']==='semantic'?'':'vd';
  const v = n => p?`--${p}-${n}`:`--${n}`;
  L.push('/* Verdigris — derived token seed */');
  L.push('/* Generated from calibration answers. Values marked TBD await design work. */');
  L.push(':root{');
  L.push('  /* ── tier 1 · primitives ─────────────────── */');
  L.push('  '+v('bg')+': #161614;');
  L.push('  '+v('bg-dim')+': #111110;');
  L.push('  '+v('bg-hi')+': #1e1d1b;');
  L.push('  '+v('bg-sel')+': #2c2b28;');
  L.push('  '+v('dim')+': #524e48;   /* 2.6:1 on bg — non-text only */');
  L.push('  '+v('bone')+': #D0CAB8;');
  L.push('  '+v('bone-bright')+': #E8E2D0;');
  L.push('  '+v('white')+': #F0EDE4;');
  const pal={green:'#44BB44',orange:'#C4834A',teal:'#4AACA4',blue:'#5B8DB8',purple:'#8855BB',lime:'#AAFF00',red:'#CC5555'};
  Object.entries(pal).forEach(([k,h])=>L.push('  '+v(k)+': '+h+';'));

  const map=A['cl-map']||{};
  const used=Object.entries(map).filter(([k,c])=>c&&c!=='unused');
  if(used.length){
    L.push('');
    L.push('  /* ── tier 2 · semantic ───────────────────── */');
    used.forEach(([k,c])=>L.push('  '+v(c)+': var('+v(k)+');'));
    const unused=(SECTIONS.find(s=>s.id==='color').qs.find(q=>q.id==='cl-map').rows||[])
      .filter(r=>!map[r.v]||map[r.v]==='unused').map(r=>r.n.toLowerCase());
    if(unused.length) L.push('  /* unused on the web: '+unused.join(', ')+' */');
  }

  const unit=A['sp-unit']==='4'?4:A['sp-unit']==='8'?8:null;
  L.push('');
  L.push('  /* ── space ───────────────────────────────── */');
  if(unit){ [1,2,3,4,6,8,12,16,24].forEach((m,i)=>L.push('  '+v('space-'+(i+1))+': '+(m*unit)+'px;')); }
  else L.push('  /* baseline-derived — computed from --'+(p||'')+'-lh-body */');

  const ratios={minor3:1.2,perf4:1.333,dramatic:null};
  const r=ratios[A['ty-scale']];
  L.push('');
  L.push('  /* ── type scale ──────────────────────────── */');
  if(r){ let s=14; for(let i=0;i<7;i++){ L.push('  '+v('fs-'+i)+': '+(Math.round(s*100)/100)+'px;'); s*=r; } }
  else if(A['ty-scale']==='dramatic'){ [14,16,18,56,72].forEach((n,i)=>L.push('  '+v('fs-'+i)+': '+n+'px;')); }
  else L.push('  /* scale ratio not selected */');

  const meas={tight:['62ch','1.55'],std:['68ch','1.7'],open:['58ch','1.85']}[A['ty-measure']];
  if(meas){ L.push('  '+v('measure')+': '+meas[0]+';'); L.push('  '+v('lh-body')+': '+meas[1]+';'); }

  const rad={'0':'0','1':'2px','4':'4px','mixed':'0'}[A['sf-radius']];
  L.push('');
  L.push('  /* ── surface ─────────────────────────────── */');
  if(rad!==undefined){
    L.push('  '+v('radius')+': '+rad+';');
    if(A['sf-radius']==='mixed') L.push('  '+v('radius-interactive')+': 3px;');
  }
  const bord={hair:'1px solid var('+v('bg-sel')+')',rule:'0',fill:'0',brack:'0'}[A['sf-card']];
  if(bord!==undefined) L.push('  '+v('card-border')+': '+bord+';');

  const dur={1:100,2:140,3:180,4:240,5:320,6:440,7:600}[A['mo-speed']];
  const ease={linear:'linear',sharp:'cubic-bezier(.2,.6,.2,1)',soft:'cubic-bezier(.4,0,.2,1)',spring:'cubic-bezier(.34,1.56,.64,1)'}[A['mo-easing']];
  L.push('');
  L.push('  /* ── motion ──────────────────────────────── */');
  if(dur){ L.push('  '+v('dur-fast')+': '+Math.round(dur*0.6)+'ms;'); L.push('  '+v('dur')+': '+dur+'ms;');
           L.push('  '+v('dur-slow')+': '+Math.round(dur*1.7)+'ms;'); }
  if(ease) L.push('  '+v('ease')+': '+ease+';');

  const fr={solid:['2px solid var('+v('teal')+')','2px'],double:['3px solid var('+v('lime')+')','2px'],
            inset:['2px solid var('+v('bone-bright')+')','-4px'],block:['2px solid var('+v('bone-bright')+')','2px']}[A['ax-focus']];
  L.push('');
  L.push('  /* ── focus ───────────────────────────────── */');
  if(fr){ L.push('  '+v('focus-ring')+': '+fr[0]+';'); L.push('  '+v('focus-offset')+': '+fr[1]+';'); }
  L.push('}');

  if(A['cl-light']==='both'){
    L.push('');
    L.push('/* light theme — TBD, inverted from bone/ink */');
    L.push('@media (prefers-color-scheme: light){ :root{ /* … */ } }');
  }
  return L.join('\n');
}

function brief(){
  const L=[]; const d=new Date();
  const stats=allQs().filter(x=>required(x.q));
  L.push('# Verdigris — Visual Language Calibration');
  L.push('');
  L.push('Completed: '+d.toISOString().slice(0,10)+'  ·  Answered '+stats.filter(x=>answered(x.q)).length+'/'+stats.length+' required');
  L.push('');
  SECTIONS.filter(s=>s.qs).forEach(s=>{
    L.push('');
    L.push('## '+s.num+' · '+s.title);
    s.qs.forEach(q=>{
      const lab=q.label?q.label.replace(/<[^>]+>/g,''):q.name;
      if(q.type==='bakeoff'){
        const sc=A[q.id+'.score'], st=A[q.id+'.steal'];
        if(!sc&&!st) return;
        L.push('');
        L.push('**'+q.name+'** — fit '+(sc||'—')+'/5');
        if(st&&st.trim()) L.push('> steal: '+st.trim());
        return;
      }
      if(!answered(q)) return;
      const v=A[q.id];
      L.push('');
      L.push('**'+lab+'**');
      if(q.type==='scale7'){ L.push(''); L.push(v+'/7  ('+q.poles[0]+' → '+q.poles[1]+')'); }
      else if(q.type==='choice'){ const o=q.opts.find(x=>x.v===v);
        L.push(''); L.push('→ '+(o?o.t.replace(/<[^>]+>/g,''):v)); }
      else if(q.type==='specimen'){ const o=q.opts.find(x=>x.v===v);
        L.push(''); L.push('→ '+(o?o.k:v)+(o&&o.tag?'  ['+o.tag+']':'')); }
      else if(q.type==='multi'){ L.push('');
        v.forEach(x=>{const o=q.opts.find(y=>y.v===x); L.push('- '+(o?o.t.replace(/<[^>]+>/g,''):x));}); }
      else if(q.type==='map'){ L.push('');
        const lab=x=>{const c=q.cols.find(y=>y.v===x); return c?c.t:x;};
        q.rows.forEach(r=>{ const c=v[r.v]; if(c&&c!=='unused')
          L.push('- '+r.n+' `'+r.hex+'` → '+lab(c)+'  `'+(p0())+c+'`'); });
        const un=q.rows.filter(r=>!v[r.v]||v[r.v]==='unused').map(r=>r.n);
        if(un.length) L.push('- *unused:* '+un.join(', ')); }
      else { L.push(''); String(v).trim().split('\n').forEach(l=>L.push('> '+l)); }
    });
    const note=s.qs.find(q=>q.id.endsWith('-note'));
    if(note&&!answered(note)) {}
  });
  L.push('');
  L.push('---');
  L.push('');
  L.push('## Derived token seed');
  L.push('');
  L.push('```css');
  L.push(deriveTokens());
  L.push('```');
  return L.join('\n');
}

function outputHTML(){
  const req=allQs().filter(x=>required(x.q));
  const done=req.filter(x=>answered(x.q)).length;
  const opt=allQs().filter(x=>x.q.optional);
  const optDone=opt.filter(x=>answered(x.q)).length;
  const gaps=req.filter(x=>!answered(x.q));
  return `
  <div class="stat">
    <div><b>${done}/${req.length}</b><span class="lbl">Required</span></div>
    <div><b>${optDone}/${opt.length}</b><span class="lbl">Optional</span></div>
    <div><b>${Math.round(done/req.length*100)}%</b><span class="lbl">Complete</span></div>
  </div>
  ${gaps.length?`<div class="warn"><b>${gaps.length} required question${gaps.length>1?'s':''} unanswered.</b>
    ${gaps.slice(0,6).map(g=>`<br><span class="mono" style="font-size:11.5px;color:var(--dim2)">${g.s.num} · ${esc((g.q.label||g.q.name||'').replace(/<[^>]+>/g,'').slice(0,74))}</span>`).join('')}
    ${gaps.length>6?`<br><span class="mono" style="font-size:11.5px;color:var(--dim2)">+ ${gaps.length-6} more</span>`:''}
  </div>`:`<div class="warn" style="border-color:var(--green)"><b style="color:var(--green)">Complete.</b> Hand the brief back and I will build the system.</div>`}
  <div class="tabs">
    <button data-tab="md" class="on">Design brief · md</button>
    <button data-tab="css">Token seed · css</button>
    <button data-tab="json">Answers · json</button>
  </div>
  <div class="outbox" id="outbox"></div>
  <div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap">
    <button class="btn pri" id="b-copy">Copy</button>
    <button class="btn" id="b-dl">Download</button>
    <button class="btn" id="b-dlall">Download all three</button>
  </div>`;
}

/* ── section render ────────────────────────────────────── */
function render(){
  const s=SECTIONS[cur];
  const st=document.getElementById('stage');
  let inner=`<div class="sec-head">
    <div class="sec-num">${s.num==='—'?'OUTPUT':'SECTION '+s.num}</div>
    <h1 class="sec-title">${s.title}</h1>
    ${s.lede?`<p class="sec-lede">${s.lede}</p>`:''}
  </div>`;
  if(s.intro) inner+=introHTML();
  else if(s.output) inner+=outputHTML();
  else { let n=0; inner+=s.qs.map(q=>{ if(q.type!=='bakeoff'&&!q.optional) n++; return qHTML(q,n); }).join(''); }

  inner+=`<div class="secnav">
    <button class="btn" id="b-prev" ${cur===0?'disabled':''}>← Back</button>
    <div class="spacer"></div>
    ${cur<SECTIONS.length-1?`<button class="btn pri" id="b-next">${cur===0?'Begin':'Next'} →</button>`:''}
  </div>`;
  st.innerHTML=inner;
  window.scrollTo({top:0,behavior:'instant'});
  if(s.output) showTab(curTab);
  bindStage();
  renderNav();
}

let curTab='md';
function tabText(t){ return t==='md'?brief():t==='css'?deriveTokens():JSON.stringify(A,null,2); }
function showTab(t){
  curTab=t;
  const b=document.getElementById('outbox'); if(!b) return;
  b.textContent=tabText(t);
  document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===t));
}

function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=SECTIONS.map((s,i)=>{
    const st=secStats(s);
    const done=st&&st.done===st.total&&st.total>0;
    return `<button class="nav-item ${i===cur?'on':''} ${done?'done':''}" data-go="${i}">
      <span class="n">${s.num==='—'?'··':s.num}</span><span>${s.nav}</span>
      ${st?`<span class="ct">${st.done}/${st.total}</span>`:''}</button>`;
  }).join('');
  const req=allQs().filter(x=>required(x.q));
  const done=req.filter(x=>answered(x.q)).length;
  const pct=Math.round(done/req.length*100);
  document.getElementById('barfill').style.width=pct+'%';
  document.getElementById('pcount').textContent=done+' / '+req.length;
  document.getElementById('ppct').textContent=pct+'%';
}

/* ── events ────────────────────────────────────────────── */
function set(k,v){ A[k]=v; save(); renderNav(); }

function bindStage(){
  const st=document.getElementById('stage');

  st.querySelectorAll('textarea[data-q],input[data-q]').forEach(el=>{
    el.addEventListener('input',()=>set(el.dataset.q,el.value));
  });
  st.querySelectorAll('[data-scale]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.dataset.scale, v=+el.dataset.v;
      set(k, A[k]==v?undefined:v);
      el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',A[k]==+b.dataset.v));
    });
  });
  st.querySelectorAll('[data-opt]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.dataset.opt, v=el.dataset.v;
      set(k, A[k]===v?undefined:v);
      const q=allQs().find(x=>x.q.id===k).q;
      if(q.type==='specimen'){
        st.querySelectorAll('[data-opt="'+k+'"]').forEach(h=>
          h.parentElement.classList.toggle('on',h.dataset.v===A[k]));
      } else {
        st.querySelectorAll('[data-opt="'+k+'"]').forEach(h=>h.classList.toggle('on',h.dataset.v===A[k]));
      }
    });
  });
  st.querySelectorAll('[data-multi]').forEach(el=>{
    el.addEventListener('click',()=>{
      const k=el.dataset.multi, v=el.dataset.v;
      const arr=(A[k]||[]).slice();
      const i=arr.indexOf(v);
      i>=0?arr.splice(i,1):arr.push(v);
      set(k,arr);
      el.classList.toggle('on',arr.includes(v));
    });
  });
  st.querySelectorAll('[data-map]').forEach(el=>{
    el.addEventListener('change',()=>{
      const k=el.dataset.map;
      const o=Object.assign({},A[k]||{});
      o[el.dataset.k]=el.value;
      set(k,o);
    });
  });

  const p=document.getElementById('b-prev'), n=document.getElementById('b-next');
  if(p) p.addEventListener('click',()=>{ if(cur>0){cur--;render();} });
  if(n) n.addEventListener('click',()=>{ if(cur<SECTIONS.length-1){cur++;render();} });

  st.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
  const c=document.getElementById('b-copy');
  if(c) c.addEventListener('click',()=>{
    navigator.clipboard.writeText(tabText(curTab)).then(()=>toast('Copied'),()=>toast('Copy blocked — select manually'));
  });
  const d=document.getElementById('b-dl');
  if(d) d.addEventListener('click',()=>dl(curTab));
  const da=document.getElementById('b-dlall');
  if(da) da.addEventListener('click',()=>{ ['md','css','json'].forEach((t,i)=>setTimeout(()=>dl(t),i*260)); });
}

function dl(t){
  const name={md:'verdigris-brief.md',css:'verdigris-tokens.css',json:'verdigris-answers.json'}[t];
  const blob=new Blob([tabText(t)],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('Saved '+name);
}

document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(!b) return;
  cur=+b.dataset.go; render();
});
document.getElementById('b-save').addEventListener('click',()=>{save();toast('Saved locally');});
document.getElementById('b-out').addEventListener('click',()=>{cur=SECTIONS.length-1;render();});
const rs=document.getElementById('b-reset');
let armed=false;
rs.addEventListener('click',()=>{
  if(!armed){
    armed=true; rs.textContent='Erase all?';
    rs.style.color='var(--red)'; rs.style.borderColor='var(--red)';
    clearTimeout(rs._t);
    rs._t=setTimeout(()=>{ armed=false; rs.textContent='Reset'; rs.style.color=''; rs.style.borderColor=''; },3500);
    return;
  }
  armed=false; rs.textContent='Reset'; rs.style.color=''; rs.style.borderColor='';
  A={}; save(); cur=0; render(); toast('Erased');
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('textarea,input,select')) return;
  if(e.key==='ArrowRight'&&cur<SECTIONS.length-1){cur++;render();}
  if(e.key==='ArrowLeft'&&cur>0){cur--;render();}
});

load(); render();
</script>
</body>
</html>
