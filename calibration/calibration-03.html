<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   SPECIMEN BUILDERS
   Every colour below is a literal. A specimen must never
   inherit from the page, or it would show the palette it is
   arguing about.
   ═══════════════════════════════════════════════════════════ */

const BONE={t:'#D0CAB8',s:'#E8E2D0',m:'#F0EDE4',d:'#A8A192'};

/* §01 — the rail plus a card, in one palette assignment.
   p = {struct, data, ordinalNumerals, cool} */
function railSpec(p, horiz){
  const ords = p.ordinalNumerals===false;
  const rows = ords
    ? [['04','Systems',p.data],['2020','Since',p.data]]
    : [['01','Section',p.struct],['04','Systems',p.data],['2020','Since',p.data]];
  return `<div class="sp rl ${horiz?'rlh':''}">
    <div class="rail">${rows.map(r=>
      `<span class="ro"><span class="rv" style="color:${r[2]}">${r[0]}</span>
       <span class="rk">${r[1]}</span></span>`).join('')}</div>
    <div>
      <span class="e">Work</span>
      <h4>Four systems</h4>
      <p>Each of these is running, not proposed. Where an employer owns the work, the case study is sanitized and says so.</p>
      <div class="card">
        <div class="cx"><b style="color:${p.struct}">01</b> Agent systems</div>
        <div class="ct">The Agent Operating System</div>
        <div class="pf">
          <span><b style="color:${p.data}">4</b> agents</span>
          <span><b style="color:${p.data}">2026</b> adopted</span>
          <span><b style="color:${BONE.s}">running</b> status</span>
        </div>
      </div>
    </div>
  </div>`;
}

/* §02 — hero with a live topolang field.
   mask1/mask2 = the transparent→opaque ramp of the field mask.
   over        = how far the display line runs past the mask start. */
function heroSpec(o){
  const mode=o.mode||'STRATA', pal=o.palette||'VERDIGRIS';
  const m1=o.m1==null?62:o.m1, m2=o.m2==null?80:o.m2;
  const scrim=o.scrim||'none';
  const cw=o.cellW||9, ch=o.cellH||15, fs=o.fontSize||13;
  const words='Designing instruments for cognition, creativity, and complex systems.';
  const line=scrim==='plate'
    ? words.split(' ').map(w=>`<span>${w}</span>`).join(' ')
    : words;
  const cfg=JSON.stringify({mode:mode,palette:pal,cellW:cw,cellH:ch,fontSize:fs,
    opacity:o.opacity==null?0.78:o.opacity,seed:20260801});
  return `<div class="sp hr sc-${scrim}">
    <div class="fieldbox" data-topo='${cfg}'
      style="-webkit-mask-image:linear-gradient(90deg,transparent 0%,transparent ${m1}%,#000 ${m2}%,#000 100%);
             mask-image:linear-gradient(90deg,transparent 0%,transparent ${m1}%,#000 ${m2}%,#000 100%)"></div>
    <div class="in">
      ${o.label===false?'':`<span class="e">${o.label||'01 / Thesis'}</span>`}
      <h3 style="max-width:${o.over==null?66:o.over}%">${line}</h3>
      <div class="sub">I design and operate governed human-AI systems.</div>
    </div>
    <div class="cap">Hero field rendered by topolang v1.3.2 · ${mode} character mode · 9/9 conformance.</div>
  </div>`;
}

/* §03 — section head variants */
function headSpec(o){
  return `<div class="sp hd">
    ${o.rule?`<div class="rule">${o.mark?'<i></i>':''}</div>`:''}
    ${o.readout?`<div class="rdo"><span><b>04</b> systems</span><span><b>2020</b> since</span></div>`:''}
    ${o.eyebrow===false?'':`<span class="e">${o.eyebrow}</span>`}
    <h4>Four systems</h4>
    <p>Each of these is running, not proposed. Where an employer owns the work, the case study is sanitized and says so.</p>
  </div>`;
}

/* §04 — light mode. t = a full theme spec, both grounds. */
function lightSpec(t){
  const card=(T)=>`
    <span class="e" style="color:${T.muted}">Work</span>
    <h4 style="color:${T.max}">Four systems</h4>
    <p style="color:${T.text}">Each of these is running, not proposed — see
      <a href="#" style="color:${T.link};border-color:${T.link}">the case study</a>.</p>
    <div class="card" style="border-color:${T.rule}">
      <div class="cx" style="color:${T.muted}"><b style="color:${T.struct}">01</b> Agent systems</div>
      <div class="ct" style="color:${T.strong}">The Agent Operating System</div>
      <div class="pf" style="border-color:${T.ruleSoft};color:${T.muted}">
        <span><b style="color:${T.data}">4</b> agents</span>
        <span><b style="color:${T.data}">2026</b> adopted</span>
      </div>
    </div>`;
  return `<div class="sp lt duo">
    <div style="background:${t.dark.bg}">${card(t.dark)}</div>
    <div style="background:${t.light.bg}">${card(t.light)}</div>
  </div>`;
}
const DARK_T={bg:'#161614',text:'#D0CAB8',strong:'#E8E2D0',max:'#F0EDE4',muted:'#A8A192',
  struct:'#44BB44',data:'#AAFF00',link:'#7FA9CE',rule:'#2c2b28',ruleSoft:'#211f1d'};

/* §05 — UI primitives */
function ctlSpec(variant){
  return `<div class="sp ui v-${variant}">
    <div class="fld"><span class="fl">Agent name</span>
      <input type="text" value="orchestrator-01"></div>
    <div class="fld"><span class="fl">Context boundary</span>
      <select><option>explicit — files are truth</option></select>
      <span class="fh">Determines what the agent may read.</span></div>
    <div class="fld">
      <div class="cr"><span class="bx on"></span> Carry provenance on every claim</div>
      <div class="cr"><span class="bx"></span> Allow unsourced generation</div>
      <div class="cr"><span class="bx rd on"></span> Deterministic replay</div>
      <div class="cr"><span class="tg on"><i></i></span> Validation gate before deploy</div>
    </div>
  </div>`;
}
function tableSpec(v){
  return `<div class="sp ui t-${v}"><table>
    <tr><th>Agent</th><th>Status</th><th>Claims</th><th style="text-align:right">Uptime</th></tr>
    <tr><td>orchestrator</td><td>running</td><td class="n">1,284</td><td class="n">99.4</td></tr>
    <tr><td>archivist</td><td>running</td><td class="n">862</td><td class="n">99.9</td></tr>
    <tr><td>validator</td><td>idle</td><td class="n">2,041</td><td class="n">98.1</td></tr>
    <tr><td>publisher</td><td>running</td><td class="n">431</td><td class="n">99.7</td></tr>
  </table></div>`;
}

/* §08 — form + feedback states */
function errSpec(v){
  const wrap=(inner)=>`<div class="sp st v-${v}">${inner}</div>`;
  if(v==='rail') return wrap(`
    <div class="fld err"><span class="fl">Seed</span>
      <span class="inw"><input type="text" value="2026-08-0"></span>
      <span class="em"><i>!</i> Must be 8 digits. Got 9.</span></div>
    <div class="fld ok"><span class="fl">Contour colour</span>
      <span class="inw"><input type="text" value="#4FB8AF"></span>
      <span class="em good"><i>✓</i> 7.60:1 · AAA</span></div>`);
  return wrap(`
    <div class="fld err"><span class="fl">Seed</span><input type="text" value="2026-08-0">
      <span class="em">${v==='icon'?'<i>!</i>':''} Must be 8 digits. Got 9.</span></div>
    <div class="fld ok"><span class="fl">Contour colour</span><input type="text" value="#4FB8AF">
      <span class="em good">${v==='icon'?'<i>✓</i>':''} 7.60:1 · AAA</span></div>`);
}

/* ═══════════════════════════════════════════════════════════
   SECTIONS
   ═══════════════════════════════════════════════════════════ */
const SECTIONS=[

{id:'intro',num:'00',nav:'What I measured',title:'What I measured',noCount:true,intro:true,
 lede:'Before the questions, the findings. The colour problem you felt is real and it measures worse than it looks. Two of the five scope items you listed are cheap; three are large enough that they change what this system <em>is</em>. Section 09 is where you decide that.'},

/* ── 01 · COLOUR ─────────────────────────────────────────── */
{id:'colour',num:'01',nav:'Colour',title:'The green / lime collision',
 lede:'Lime <code>#AAFF00</code> is hue 80°. Green <code>#44BB44</code> is hue 120°. In the rail they share face, size, weight, tabular numerals, alignment and label — so hue carries the entire semantic load, and 40° in the yellow-green sector cannot carry it. What reads is not <em>two categories</em>, it is <em>one colour, one of which is dimmed</em>. Use the vision simulator on every specimen below; it is the fastest way to feel why.',
 vbar:true,
 qs:[
  {id:'c-fix',type:'specimen',
   label:'Which resolution?',
   help:'Previews are the real rail and the real card, at real size. Flip the simulator to <b>Deuteranopia</b> on each one — the option that survives that is the one that is actually solving the problem rather than moving it.',
   opts:[
    {v:'a',k:'A · Keep the palette, delete the ordinal numerals',tag:'cheapest true fix',cost:'free',
     html:railSpec({struct:'#44BB44',data:'#AAFF00',ordinalNumerals:false}),
     note:'Green stops appearing as a numeral anywhere. It keeps rules, section marks, contour lines, card indices and active nav — which is what your own doctrine assigns it. The <span class="m">01 / SECTION</span> readout was redundant anyway: the body label already says <span class="m">01 / WORK</span>. <b>Cost:</b> nothing in the token layer. <b>Does not fix:</b> green and lime still coexist on the page, and the CVD collapse is untouched.'},
    {v:'b',k:'B · Move structure to verdigris teal #4FB8AF',tag:'root-cause fix',cost:'free',
     html:railSpec({struct:'#4FB8AF',data:'#AAFF00'}),
     note:'Hue gap goes 40° → 95°. Under deuteranopia it goes <span class="m">0.4° → 179.7°</span>, because green and lime simulate to the <b>same hue</b> and teal does not. Measures <span class="m">7.60:1</span>, AAA. Saturation 0.52 sits inside the authored band with blue and red; green\'s 0.64 always read hot. And the system is <em>named</em> for the blue-green patina on oxidized copper — that colour is already in your palette, marked unassigned. <b>Cost:</b> primitive, semantic layer, topolang palettes, print.css, docs swatch table, and the <span class="m">verdigris.md</span> rationale. <b>Named risk:</b> teal-on-near-black is very well-trodden dev-tool territory; 120° green is more unusual.'},
    {v:'ab',k:'A + B · Teal structure, and no ordinal numerals',tag:'recommended',cost:'free',
     html:railSpec({struct:'#4FB8AF',data:'#AAFF00',ordinalNumerals:false}),
     note:'Fixes the adjacency at the component level <em>and</em> at the palette level, so the two accents are never peers and never near-hues. This is what I would ship. <b>Cost:</b> the union of A and B, which is really just B — A is a deletion.'},
    {v:'c',k:'C · Demote lime to focus-only; data becomes bone-700',
     html:railSpec({struct:'#44BB44',data:'#F0EDE4'}),
     note:'Numbers become the brightest <em>neutral</em> — <span class="m">#F0EDE4</span> at 15.48:1, brighter than lime already is. Salience by luminance and the mono face, not hue. Two chromatic accents on the whole site. Survives CVD perfectly. <b>Cost:</b> you lose the instrument glow. "Live and measured data" stops being a colour category, and the readout rail loses much of its reason to exist as a visual device. On a site whose thesis is instrumentation, that is a real loss.'},
    {v:'d',k:'D · Cool the lime to #CFFF3D, keep both greens',
     html:railSpec({struct:'#44BB44',data:'#CFFF3D'}),
     note:'Closes the saturation gap (1.00 → 0.76) in one line, so the neon stops shouting next to an authored green. <b>But:</b> hue barely moves, 80° → 75°. Still the same family, still <span class="m">0.4°</span> apart under deuteranopia, and at lower chroma lime is no longer maximum salience — just a pale yellow-green. Half a fix that costs you the signature. Included so you can rule it out by eye.'},
   ]},

  {id:'c-horiz',type:'specimen',
   label:'Confirm against the ≤860px rail, which is where it is worst.',
   help:'Under 860px the rail flattens to a horizontal row: the two numerals land on the <b>same baseline, 30px apart</b>, with nothing but hue between them. If your resolution does not hold here it does not hold. Same four options, mobile layout.',
   opts:[
    {v:'a',k:'A · no ordinal numerals',html:railSpec({struct:'#44BB44',data:'#AAFF00',ordinalNumerals:false},true)},
    {v:'ab',k:'A + B · teal, no ordinal numerals',tag:'recommended',html:railSpec({struct:'#4FB8AF',data:'#AAFF00',ordinalNumerals:false},true)},
    {v:'b',k:'B · teal structure, ordinals kept',html:railSpec({struct:'#4FB8AF',data:'#AAFF00'},true)},
    {v:'keep',k:'Current — green ordinal beside lime quantity',tag:'the problem',html:railSpec({struct:'#44BB44',data:'#AAFF00'},true),
     note:'Shown for reference. Do not pick this one unless you have changed your mind about the whole premise.'},
   ]},

  {id:'c-teal',type:'specimen',
   label:'If teal wins: which value?',
   help:'All four clear AAA on <span class="m">#161614</span>. Higher ratio means more presence but less "patina" — past about 8.5:1 it starts to read mint rather than oxidized copper. Structure is high-frequency and low-salience, so I would not go bright.',
   opts:[
    {v:'t720',k:'#4DB3AA · 7.20:1',tag:'closest to the original token',
     html:railSpec({struct:'#4DB3AA',data:'#AAFF00',ordinalNumerals:false}),
     note:'One step off your existing <span class="m">#4AACA4</span>, which measures 6.67:1 and just misses. Truest to the patina reference. <b>Cost:</b> only 0.20 of headroom above the AAA floor, so any future ground-tone change re-breaks it.'},
    {v:'t760',k:'#4FB8AF · 7.60:1',tag:'recommended',
     html:railSpec({struct:'#4FB8AF',data:'#AAFF00',ordinalNumerals:false}),
     note:'Real headroom, still unmistakably aged copper rather than mint. This is the value used in every other specimen on this page.'},
    {v:'t807',k:'#58BDB4 · 8.07:1',
     html:railSpec({struct:'#58BDB4',data:'#AAFF00',ordinalNumerals:false}),
     note:'More presence. Useful if structure needs to hold up as a hairline on <span class="m">#111110</span> sunken panels as well as on the page ground.'},
    {v:'t835',k:'#5CC0B7 · 8.35:1',
     html:railSpec({struct:'#5CC0B7',data:'#AAFF00',ordinalNumerals:false}),
     note:'The brightest I would allow. Past here the patina reading is gone and it competes with lime for salience, which re-creates the original problem in a different key.'},
   ]},

  {id:'c-contour',type:'choice',
   label:'Does the topolang hero contour follow the structure colour?',
   help:'The field\'s contour is currently <span class="m">#44BB44</span>, chosen because "lime contours read as hazard tape; green reads as terrain." If structure moves to teal and the contour does not, you get a green hero above a teal site — worse than what you have now.',
   opts:[
    {v:'follow',t:'Yes — contour tracks structure',d:'One colour means one thing everywhere. The hero becomes an <b>oxidized-copper topographic map</b>, which fits "instruments for cognition" better than phosphor green and visually separates Verdigris from the Phosphor palette it descends from. <b>This is the answer if you pick B.</b>'},
    {v:'stay',t:'No — the field keeps its own green',d:'Defensible only if you frame the field as a <em>quotation of Phosphor</em> rather than part of the Verdigris palette, and say so in the caption. Riskier: most readers will just see two greens.'},
    {v:'bone',t:'Contour goes achromatic',d:'Field becomes bone/shadow relief with no accent at all. Removes the question entirely and makes the hero calmer. <b>Cost:</b> the field stops carrying any palette signal, and it is the first thing anyone sees.'},
   ]},

  {id:'c-green',type:'choice',
   label:'If structure moves to teal, what happens to #44BB44?',
   opts:[
    {v:'pillar',t:'Retires to --vd-pillar-1',d:'Survives for Prismatic Instrument contexts only — multi-pillar or spectrum content where colour coding is the explicit subject. Keeps the Phosphor lineage documented without letting it onto the page.'},
    {v:'gone',t:'Deleted from the palette',d:'Cleanest. One fewer near-hue to police. <b>Cost:</b> breaks the stated lineage to Phosphor, which is a real part of the Verdigris story.'},
    {v:'swap',t:'Green and teal swap roles — green becomes pillar-1, teal takes structure, and the pillar ramp is re-derived',d:'Most rigorous, most work: the four pillar colours also need to be checked against each other, and <span class="m">#C4834A</span> orange already collides with lime under deuteranopia.'},
   ]},

  {id:'c-year',type:'choice',
   label:'Years — <span class="m">2020 SINCE</span>, <span class="m">2026 ADOPTED</span>. Data or not?',
   help:'Your rule is ordinals count position and are structure; quantities count amount and are data. A year is a position on a timeline, not an amount — so by your own rule these are on the wrong side. This is not cosmetic: it decides whether the rail has one accent in it or two.',
   opts:[
    {v:'data',t:'Leave them lime — a year is a measurement',d:'Simplest, and keeps the rail visually consistent. Requires amending the doctrine to say "numerals that answer <em>how many</em> or <em>when</em>", which is honest enough.'},
    {v:'neutral',t:'Years become bone-strong, not accented',d:'Lime then appears <b>only</b> on true counts — <span class="m">4 agents</span>, <span class="m">1,284 claims</span>, <span class="m">41/41</span>. Much rarer, so much louder when it does appear. My pick.'},
    {v:'struct',t:'Years become structure colour',d:'Consistent with "position, not amount" — but it puts the structure colour back into the rail as a numeral, which is the adjacency you are trying to remove. Only viable alongside option B.'},
   ]},

  {id:'c-cvd',type:'choice',
   label:'How hard is the CVD finding allowed to bite?',
   help:'Measured, Viénot 1999: under deuteranopia lime → <span class="m">#EAEB20</span> and green → <span class="m">#A3A44A</span>. Hue gap <b>0.4°</b> — the same hue, two stops of value apart. And lime lands <b>1.27:1</b> from simulated body text, so <em>data stops being distinguishable from prose</em>. WCAG conformance is unaffected (it does not simulate CVD), so your AAA claim stands as measured. The question is whether you want the claim to be narrower and truer.',
   opts:[
    {v:'design',t:'Treat CVD separation as a design constraint, and say so in the docs',d:'Every accent pair must hold either a hue gap or a value gap <em>after</em> dichromat simulation. Publish the simulated table next to the measured one. This is the version of the accessibility claim that a specialist would actually respect — and it is a differentiator, because almost nobody does it.'},
    {v:'note',t:'Document it as a known limitation, change nothing structural',d:'Honest and cheap. Add a paragraph to the accessibility notes stating the hue-pair weakness and why the ratios still hold.'},
    {v:'skip',t:'Out of scope — measured AAA is the claim, and it holds',d:'Defensible. But you print AAA in the rail and the footer, so someone will check.'},
   ]},

  {id:'c-note',type:'prose',rows:3,label:'Colour notes.',optional:true,
   ph:'Anything the specimens made you notice that the options do not cover.'},
]},

/* ── 02 · HERO ───────────────────────────────────────────── */
{id:'hero',num:'02',nav:'Hero field',title:'The hero field',
 lede:'You want the mobile character set on desktop, a wider field, and the display line to lightly overrun it. All three previews below are <b>live topolang</b>, not mockups — same DSL, same seed, same runtime that ships. The third question is the one with teeth: the mask that keeps the field out of the text column is a contrast constraint, so overrunning it needs a real answer, not just a smaller number.',
 vbar:true,
 qs:[
  {id:'h-mode',type:'specimen',
   label:'Which character mode carries the desktop hero?',
   help:'Currently STRATA above 860px and SHADE below it. You said the mobile set is better. SHADE has no contour pass at all, so it renders as dithered relief rather than contour lines — which is why it reads calmer.',
   opts:[
    {v:'shade',k:'SHADE · dithered relief',tag:'your preference — the mobile set',
     html:heroSpec({mode:'SHADE',palette:'VERDIGRIS_BAND',m1:52,m2:72,cellW:8,cellH:13,fontSize:12,opacity:.62}),
     note:'Glyph set <span class="m">· . + # @</span>, no contour pass. Terrain reads as texture instead of line-work, which is quieter and much more legible at the edges. Shown with <span class="m">VERDIGRIS_BAND</span>, the brighter ramp, because without contours the bands have to carry the whole read. <b>Cost:</b> the band ramp tops out at <span class="m">#5f8746</span>, well above the desktop luminance cap — so if this goes desktop-wide the "field is safe under text unconditionally" guarantee needs re-measuring, or the mask has to stay absolute.'},
    {v:'strata',k:'STRATA · contour lines',tag:'current desktop',
     html:heroSpec({mode:'STRATA',palette:'VERDIGRIS',m1:62,m2:80}),
     note:'Glyph set <span class="m">. _ - = ≈ ≡ █</span> plus a contour pass in <span class="m">#44BB44</span>. Because the band colours are luminance-capped for the AAA claim, shading is nearly invisible and the contour lines carry the entire read — it is a contour map, not shaded relief. <b>Cost:</b> the line-work is busy at the mask edge, which is exactly where you want text to cross it.'},
    {v:'relief',k:'RELIEF · circular glyphs',tag:'the untried third mode',
     html:heroSpec({mode:'RELIEF',palette:'VERDIGRIS',m1:52,m2:72}),
     note:'Glyph set <span class="m">. ° o O 0 @ █</span> with a <span class="m">+ - ¦</span> contour pass. Rounder and more instrument-dial than STRATA, busier than SHADE. Worth one look since it already exists in the runtime and has never been on the site.'},
    {v:'shade-capped',k:'SHADE with the desktop luminance cap',tag:'the safe hybrid',
     html:heroSpec({mode:'SHADE',palette:'VERDIGRIS',m1:52,m2:72,cellW:8,cellH:13,fontSize:12,opacity:.78}),
     note:'The character set you prefer, on the <em>capped</em> VERDIGRIS ramp rather than the bright band ramp. Keeps the unconditional contrast guarantee intact. <b>Cost:</b> with no contours and capped bands, there is very little left to see — check whether this reads as "subtle" or as "broken".'},
   ]},

  {id:'h-dial',type:'dial',
   label:'Dial the field width and the overrun.',
   help:'Live. <b>Mask start</b> is where the field begins to appear (lower = wider field, further left). <b>Mask ramp</b> is how long the fade takes. <b>Line width</b> is the display measure as a percentage of the hero — push it past the mask start and the line begins to overrun the field. Watch the last two words.',
   spec:'hero',
   ctrls:[
    {k:'m1',label:'Mask start',min:20,max:75,step:1,def:52,unit:'%'},
    {k:'m2',label:'Mask ramp end',min:30,max:100,step:1,def:72,unit:'%'},
    {k:'over',label:'Line width',min:50,max:105,step:1,def:78,unit:'%'},
    {k:'opacity',label:'Field opacity',min:20,max:100,step:2,def:62,unit:'%'},
   ],
   segs:[
    {k:'mode',label:'Mode',opts:['SHADE','STRATA','RELIEF'],def:'SHADE'},
    {k:'palette',label:'Ramp',opts:['VERDIGRIS_BAND','VERDIGRIS'],def:'VERDIGRIS_BAND'},
    {k:'scrim',label:'Overrun treatment',opts:['none','shadow','plate','dim'],def:'none'},
   ]},

  {id:'h-scrim',type:'specimen',
   label:'How does text stay AAA where it crosses the field?',
   help:'This is the constraint you are pushing against. Bone on the lime contour is <b>1.33:1</b>; on the green contour <b>1.52:1</b>. The mask exists so contrast is always measured against flat <span class="m">#161614</span> — the CSS comment calls it "a contrast constraint, not a stylistic one." Overrun without one of these is a real AAA break, not a technicality.',
   opts:[
    {v:'shadow',k:'Soft ground halo behind the glyphs',tag:'recommended',
     html:heroSpec({mode:'SHADE',palette:'VERDIGRIS_BAND',m1:44,m2:64,over:92,scrim:'shadow',cellW:8,cellH:13,fontSize:12,opacity:.62}),
     note:'Layered <span class="m">text-shadow</span> in the ground colour pushes the field back a few pixels around every glyph. The letterform keeps its full 15.48:1 against ground while the field still visibly passes behind the line. <b>Cost:</b> it is a halo — at large sizes on a busy field it can read as a sticker. Needs the field opacity kept low, which the dial above lets you check.'},
    {v:'plate',k:'Opaque word plates',
     html:heroSpec({mode:'SHADE',palette:'VERDIGRIS_BAND',m1:44,m2:64,over:92,scrim:'plate',cellW:8,cellH:13,fontSize:12,opacity:.62}),
     note:'Each word sits on a solid ground rectangle. Contrast is exactly the flat-ground case, so the AAA claim is untouched and provable. <b>Cost:</b> hard-edged blocks behind the display line — a strong, deliberate, editorial look that either fits Signal Lab or fights it. Look at the ragged right edge before deciding.'},
    {v:'dim',k:'Field opacity drops under the text column',
     html:heroSpec({mode:'SHADE',palette:'VERDIGRIS_BAND',m1:44,m2:64,over:92,scrim:'dim',cellW:8,cellH:13,fontSize:12,opacity:.62}),
     note:'A second, softer mask instead of a hard cut — the field is present but faint where text crosses. Reads most naturally of the four. <b>Cost:</b> alpha only ever <em>reduces</em> effective contrast impact, so this is arguable but not provable at a fixed number; you would be claiming AAA against a surface that still changes every frame. Weakest position to defend in the accessibility notes.'},
    {v:'none',k:'No treatment — accept the overlap',
     html:heroSpec({mode:'SHADE',palette:'VERDIGRIS_BAND',m1:44,m2:64,over:92,scrim:'none',cellW:8,cellH:13,fontSize:12,opacity:.62}),
     note:'Shown so you can judge how bad it actually is with SHADE at low opacity — with no contour pass this is far less violent than it would be under STRATA. <b>But:</b> it breaks the stated guarantee, and the guarantee is a load-bearing part of your positioning. If you want this, the honest move is to soften the <em>claim</em> in the docs rather than leave it contradicted by the home page.'},
   ]},

  {id:'h-cell',type:'choice',
   label:'Cell density for the desktop field.',
   help:'Currently <span class="m">cellW 9 / cellH 15 / font 13</span> — cellH is deliberately half the 30px baseline. Widening the field means more cells, and SHADE at desktop scale can look coarse.',
   opts:[
    {v:'keep',t:'Keep 9 / 15 / 13 — stay on the baseline',d:'The half-baseline cell height is a real piece of rigour and it is cheap to keep. Coarser texture, more visible dither.'},
    {v:'fine',t:'Finer: 7 / 12 / 11 — off the baseline grid',d:'Noticeably more refined at desktop width, and SHADE benefits most. <b>Cost:</b> breaks the "every vertical measurement is a multiple or half of 30px" claim for the field specifically. Would need a documented exemption, like the decorative-rule exemption you already have.'},
    {v:'fine-half',t:'Finer but still half-baseline: 7 / 15 / 11',d:'Narrower cells, baseline-locked rows. Keeps the rigour, gains most of the refinement, and the slight cell anisotropy is invisible in a dither. <b>Probably the right answer.</b>'},
   ]},

  {id:'h-mobile',type:'choice',
   label:'If SHADE goes desktop-wide, what happens below 860px?',
   opts:[
    {v:'same',t:'One mode everywhere — the breakpoint switch goes away',d:'Simpler runtime, one thing to reason about, and the caption stops needing to name a mode that changes. Loses the "same field, different character mode" demonstration, which is currently a nice piece of evidence in the caption.'},
    {v:'invert',t:'Invert it — SHADE on desktop, STRATA in the mobile band',d:'Keeps the two-mode demonstration and gives the narrow band the line-work, where its own grid row means no text ever sits over it. <b>Check:</b> STRATA on a 39×11 grid is what the auto-range calibration comment says collapses; verify before committing.'},
    {v:'keep',t:'Keep the current split, just widen the desktop field',d:'Smallest change. Answer this one if the mode question above lands on STRATA.'},
   ]},

  {id:'h-note',type:'prose',rows:3,label:'Hero notes.',optional:true,
   ph:'Numbers off the dial, or anything the overrun treatments made you reconsider.'},
]},

/* ── 03 · NUMBERING ──────────────────────────────────────── */
{id:'nums',num:'03',nav:'Numbering',title:'Ordinals and labels',
 lede:'You want the <span class="m">01</span> gone from above the hero and the sections, and <span class="m">THESIS</span> gone from the hero. Both are right — but the ordinal is currently doing three jobs (orientation, structure-colour presence, and instrument texture), so deleting it has knock-on effects. These previews show what is left.',
 qs:[
  {id:'n-head',type:'specimen',
   label:'What replaces <span class="m">01 / WORK</span> above a section?',
   opts:[
    {v:'bare',k:'Bare label — WORK',tag:'recommended',
     html:headSpec({eyebrow:'Work',rule:true,mark:true}),
     note:'The ordinal was redundant with the rail readout and with the nav. Removing it leaves the label doing exactly one job. The green segment on the section rule still marks position, so orientation survives without a numeral. <b>Cost:</b> none that I can find.'},
    {v:'norule',k:'Bare label, no accent segment on the rule',
     html:headSpec({eyebrow:'Work',rule:true,mark:false}),
     note:'Quieter still. Removes the last piece of structure-colour presence from the section boundary. <b>Cost:</b> the rule becomes generic — every dark site has a 1px <span class="m">#2c2b28</span> line. The segment is cheap character and it is one of the few places structure colour earns its keep.'},
    {v:'readout',k:'Label replaced by a measurement strip',
     html:headSpec({eyebrow:false,rule:true,mark:true,readout:true}),
     note:'Instead of naming the section, state what is in it. Most instrument-like option, and it gives the numerals a home that is unambiguously data. <b>Cost:</b> you lose the section <em>name</em> above the heading, so the h2 has to carry all the orientation. Fine for Work; poor for Field Notes.'},
    {v:'none',k:'Nothing — heading only',
     html:headSpec({eyebrow:false,rule:true,mark:true}),
     note:'Most editorial, least instrumented. <b>Cost:</b> the mono eyebrow is a significant part of the Signal Lab register; without it the sections read like a normal essay site. Also removes the only uppercase mono element above the fold in each section.'},
   ]},

  {id:'n-hero',type:'specimen',
   label:'And above the hero, where <span class="m">01 / THESIS</span> currently sits?',
   help:'You called THESIS unnecessary and I agree — it labels the obvious. The question is whether anything belongs in that slot at all.',
   opts:[
    {v:'none',k:'Nothing — the line starts the page',tag:'recommended',
     html:heroSpec({mode:'SHADE',palette:'VERDIGRIS_BAND',m1:48,m2:68,over:82,label:false,cellW:8,cellH:13,fontSize:12,opacity:.62}),
     note:'The display line is the strongest thing you have; anything above it is a throat-clear. The caption below already carries the technical register, so nothing is lost. <b>Cost:</b> none.'},
    {v:'name',k:'Your name, as a mono eyebrow',
     html:heroSpec({mode:'SHADE',palette:'VERDIGRIS_BAND',m1:48,m2:68,over:82,label:'David Reyburn — product designer, human-AI systems',cellW:8,cellH:13,fontSize:12,opacity:.62}),
     note:'Answers "who is this" before "what do they think", which is the actual job of a portfolio hero. <b>Cost:</b> duplicates the nav mark two inches above it.'},
    {v:'status',k:'A live status line',
     html:heroSpec({mode:'SHADE',palette:'VERDIGRIS_BAND',m1:48,m2:68,over:82,label:'4 agents running · Columbus, Ohio · 2026',cellW:8,cellH:13,fontSize:12,opacity:.62}),
     note:'Most on-thesis: the instrument reports its own state before it says anything. Puts real numerals in the slot, which gives data colour a job above the fold. <b>Cost:</b> it must actually be live, or it is a decorative lie — and that is precisely the failure mode your own doctrine is about.'},
   ]},

  {id:'n-rail',type:'choice',
   label:'The rail\'s <span class="m">01 SECTION</span> readout.',
   help:'This is the same decision as colour option A, asked from the other side. Answer it here even if you already picked A.',
   opts:[
    {v:'kill',t:'Delete it — the rail carries measurements only',d:'The rail then contains nothing but true readings, which is the strongest version of the rail concept. Also removes the green/lime adjacency at its source.'},
    {v:'keep-neutral',t:'Keep it, but render it as a muted label rather than an accented numeral',d:'Orientation survives, the colour collision does not. <span class="m">SECTION 01</span> in bone-400 mono.'},
    {v:'keep',t:'Keep it as-is',d:'Only coherent if you rejected every colour option except C or D.'},
   ]},

  {id:'n-card',type:'choice',
   label:'Card indices <span class="m">01–04</span> on the four system cards.',
   help:'These are the other place structure colour appears as a numeral. They are 330px and a hairline rule away from the lime proof figures, so the collision is much weaker — but it is the same collision.',
   opts:[
    {v:'keep',t:'Keep them — they are the main thing giving structure colour presence',d:'Your CSS comment says exactly this: "This is what gives green presence: it appears on every card and every section." Cards are also genuinely ordered, so an ordinal is honest here.'},
    {v:'muted',t:'Keep the numeral, drop the accent — bone-400 instead',d:'Structure colour then lives only on non-text marks: rules, segments, contours, borders. Cleanest possible reading of "high frequency, low salience". <b>Cost:</b> structure colour nearly disappears as a visible accent.'},
    {v:'kill',t:'Delete the indices, keep only the kicker',d:'<span class="m">AGENT SYSTEMS</span> alone. Cards are in a grid, not a list, so the numbering is arguably false ordering anyway — on a two-column grid, is 03 after 02 or below it?'},
   ]},

  {id:'n-note',type:'prose',rows:2,label:'Numbering notes.',optional:true},
]},

/* ── 04 · LIGHT MODE ─────────────────────────────────────── */
{id:'light',num:'04',nav:'Light mode',title:'Multi-theme and light mode',
 lede:'I measured this before writing options, and the finding changes the question. <b>Every current accent fails on a bone ground:</b> lime 1.05:1, green 2.13:1, teal 2.04:1, blue 2.12:1. Light mode is therefore not an inversion of the ramp — it needs a second, independently authored accent set. And to clear AAA on paper those accents have to go so dark that saturation rises while lightness falls: they stop being glows and become inks.',
 vbar:true,
 qs:[
  {id:'l-do',type:'specimen',
   label:'Is there a light theme at all?',
   help:'Each preview shows the same card in dark, then the proposed light counterpart, side by side. Judge whether the light half still looks like <em>this</em> system.',
   opts:[
    {v:'ink',k:'Yes — dark is phosphor, light is printer\'s ink',tag:'recommended if you build one',
     html:lightSpec({dark:DARK_T,light:{bg:'#F0EDE4',text:'#2C2A26',strong:'#1E1D1B',max:'#161614',
       muted:'#57534B',struct:'#0A5450',data:'#454F00',link:'#22506F',rule:'#C9C3B4',ruleSoft:'#DAD5C8'}}),
     note:'Accents re-derived for paper: patina <span class="m">#0A5450</span> 7.48:1, citron <span class="m">#454F00</span> 7.56:1, slate <span class="m">#22506F</span> 7.34:1 — all AAA on <span class="m">#F0EDE4</span>. The metaphor changes honestly with the medium: <b>emitted light on dark, absorbed pigment on paper.</b> Same hue families, inverted physics. This is the version that has a rationale rather than just a switch.'},
    {v:'flip',k:'Yes — mechanical inversion, accents kept',
     html:lightSpec({dark:DARK_T,light:{bg:'#F0EDE4',text:'#2C2A26',strong:'#1E1D1B',max:'#161614',
       muted:'#57534B',struct:'#44BB44',data:'#AAFF00',link:'#7FA9CE',rule:'#C9C3B4',ruleSoft:'#DAD5C8'}}),
     note:'Shown so the failure is visible rather than theoretical. The lime is <b>1.05:1</b> — very nearly invisible. Included as evidence that "add light mode" is not a small task, not as a real option.'},
    {v:'paper',k:'Not a light mode — a paper mode, print only',
     html:lightSpec({dark:DARK_T,light:{bg:'#FAF8F2',text:'#161614',strong:'#161614',max:'#000000',
       muted:'#4A463F',struct:'#161614',data:'#161614',link:'#161614',rule:'#B8B2A4',ruleSoft:'#D6D1C4'}}),
     note:'You already ship <span class="m">print.css</span>. Extend that thinking: paper is achromatic, all accents collapse to ink, colour is treated as a property of the <em>screen</em> rather than of the system. <b>Cost:</b> does not answer the "flexible light/dark primitives" requirement — but it is a coherent, defensible position rather than a gap.'},
    {v:'no',k:'No — dark-only stays, and the docs argue for it',
     html:lightSpec({dark:DARK_T,light:{bg:'#161614',text:'#D0CAB8',strong:'#E8E2D0',max:'#F0EDE4',
       muted:'#A8A192',struct:'#4FB8AF',data:'#AAFF00',link:'#7FA9CE',rule:'#2c2b28',ruleSoft:'#211f1d'}}),
     note:'Both halves dark, because that is the proposal. <b>The honest argument:</b> a design system with one deeply-authored theme and a documented reason beats one with two shallow themes. <b>The honest counter:</b> "dark by design" is a constraint you chose, and a reviewer evaluating you against enterprise systems will read it as a capability gap unless the docs pre-empt that read explicitly. Section 09 decides which audience wins.'},
   ]},

  {id:'l-mech',type:'choice',
   label:'If there is a light theme: how is it selected?',
   opts:[
    {v:'both',t:'prefers-color-scheme by default, plus a manual override that wins',d:'<span class="m">@media (prefers-color-scheme: light)</span> sets the default; a <span class="m">data-theme</span> attribute on the root overrides in both directions. Respects the OS, still lets a reader choose. The override must win over the media query in <em>both</em> directions or the toggle feels broken.'},
    {v:'media',t:'prefers-color-scheme only, no toggle',d:'Zero UI, zero state, nothing to persist. <b>Cost:</b> a reader who wants the other one cannot have it, and you lose an obvious place to demonstrate the token architecture working.'},
    {v:'manual',t:'Manual toggle only, dark default',d:'Ignores the OS signal, which is the one accessibility-relevant input you actually get for free. I would not.'},
   ]},

  {id:'l-doctrine',type:'choice',
   label:'Light mode inverts your salience doctrine. How is that restated?',
   help:'"Data is maximum salience at 14.68:1" only means anything on dark — on paper the data colour must be the <em>darkest</em> thing, not the brightest. The three-tier model needs re-wording to survive both.',
   opts:[
    {v:'distance',t:'Restate all three tiers as distance from ground, not brightness',d:'"Data sits furthest from the ground; structure sits closest." Medium-agnostic, survives both themes, and is a genuinely better formulation of what you already meant. Requires editing the doctrine comment and the docs.'},
    {v:'pertheme',t:'Two parallel doctrines, one per theme',d:'Explicit and easy to verify per-theme. <b>Cost:</b> two things to keep in sync, and the system stops having a single story.'},
    {v:'defer',t:'Defer — decide when the light ramp is actually built',d:'Reasonable if light mode is sequenced late. Note it as an open question in the docs rather than leaving it silently contradictory.'},
   ]},

  {id:'l-field',type:'choice',
   label:'What does the topolang field do in light mode?',
   help:'Its band ramp is nine values from <span class="m">#181816</span> to <span class="m">#3a352e</span> — all near-black. On paper it would be nine indistinguishable dark smudges.',
   opts:[
    {v:'ramp',t:'Author a light band ramp — nine values descending from the paper ground',d:'The field becomes ink-on-paper relief, like a printed contour map. Fits the printer\'s-ink metaphor exactly. Real work: the ramp needs the same luminance-cap discipline in reverse.'},
    {v:'hide',t:'Field is dark-mode only; light mode gets a still frame or nothing',d:'Cheapest. <b>Cost:</b> the hero is the site\'s signature and light-mode visitors would never see it.'},
    {v:'invert',t:'Invert the existing ramp arithmetically',d:'One line. Will almost certainly look wrong — the ramp was hand-tuned against a warm near-black, and inverting it does not preserve that tuning. Worth trying once before rejecting.'},
   ]},

  {id:'l-note',type:'prose',rows:3,label:'Theme notes.',optional:true},
]},

/* ── 05 · PRIMITIVES ─────────────────────────────────────── */
{id:'prims',num:'05',nav:'Primitives',title:'Interactive UI primitives',
 lede:'The gap is real: there are no form controls, no overlays, no complex table. But "standard enterprise systems have these" is a reason to build them <em>if</em> someone is going to consume them — see section 09. What follows settles the <b>register</b> first, because once a text input exists every other control inherits its geometry, and that decision is expensive to reverse.',
 vbar:true,
 qs:[
  {id:'p-geo',type:'specimen',
   label:'What does a Verdigris form control look like?',
   help:'All three use the same tokens and the same 30px rhythm. Focus ring is the existing <span class="m">3px lime, 2px offset</span> in each. Click into a field to see it.',
   opts:[
    {v:'box',k:'Hairline box — inherits the card',tag:'most consistent',
     html:ctlSpec('box'),
     note:'Same <span class="m">1px #2c2b28</span> border and <span class="m">2px</span> radius as <span class="m">vd-system-card</span>, on the sunken surface. The system already reads as hairline boxes, so controls stop looking like a bolt-on. <b>Cost:</b> the safest and least distinctive option — it is what most dark systems do.'},
    {v:'line',k:'Underline only — terminal field',tag:'most in-register',
     html:ctlSpec('line'),
     note:'No box: a single rule under the value, which is what a terminal prompt or a paper form actually looks like. Strongest fit for the instrument metaphor and it echoes the hairline-rule language you already use structurally. <b>Cost:</b> hit targets get ambiguous, empty fields are nearly invisible, and grouped fields need explicit spacing work to stay readable. Also harder to make obviously-disabled.'},
    {v:'well',k:'Sunken well — recessed input',
     html:ctlSpec('well'),
     note:'Darker than the page with an inset top highlight, so inputs read as physically recessed. Most "hardware panel" of the three. <b>Cost:</b> introduces a shadow/bevel vocabulary the system does not currently have anywhere, and <span class="m">--vd-radius:2px</span> exists specifically because the calibration decided against skeuomorphic depth.'},
   ]},

  {id:'p-table',type:'specimen',
   label:'Data table density.',
   help:'The existing <span class="m">.vd-table</span> is minimal and has no dense variant. Numerics are already right-aligned tabular lime here.',
   opts:[
    {v:'hair',k:'Hairline rows',tag:'current, extended',
     html:tableSpec('hair'),
     note:'Row rules only, no verticals, no fill. Consistent with everything else in the system. <b>Cost:</b> at 12+ columns the eye loses the row; needs a hover row-highlight to stay usable, which the system has no token for yet.'},
    {v:'zebra',k:'Zebra on the sunken surface',
     html:tableSpec('zebra'),
     note:'Alternate rows at <span class="m">#111110</span>. Genuinely helps wide tables and costs no new tokens. <b>Cost:</b> banding is visual noise at small row counts, and it fights the flat-ground-plus-grain treatment.'},
    {v:'grid',k:'Full grid — ruled both axes',
     html:tableSpec('grid'),
     note:'Most instrument-like and best for dense numeric comparison, which is what your content actually is. <b>Cost:</b> the most visually heavy thing in the system by a wide margin; it will dominate any page it lands on.'},
   ]},

  {id:'p-set',type:'multi',
   label:'Which primitives are actually in scope? Select all that make the first tier.',
   help:'Be ruthless. Each one is documentation, a11y behaviour, focus management, keyboard support, and tests — not just CSS. My read: the first five earn their place because your own content needs them; the rest are speculative until someone consumes the system.',
   opts:[
    {v:'input',t:'Text input, textarea, select',d:'Needed by anything with a form. <b>Foundation for everything else in this list.</b>'},
    {v:'choice',t:'Checkbox, radio, toggle',d:'Cheap once the input geometry is settled. All three are in the preview above.'},
    {v:'table',t:'Complex data table — sort, dense mode, sticky header',d:'Your content is genuinely tabular (contrast ratios, effect coverage, conformance). Highest real utility of anything here.'},
    {v:'toast',t:'Toast / inline notification',d:'Needed by any form that succeeds or fails. Small surface, well-understood a11y (<span class="m">role="status"</span>, polite live region).'},
    {v:'tooltip',t:'Tooltip / popover',d:'Your docs are full of measured values that want an explanation on hover. <b>Warning:</b> tooltips are the single hardest primitive to make accessible — touch, keyboard, and screen-reader behaviour all differ.'},
    {v:'modal',t:'Modal dialog',d:'Native <span class="m">&lt;dialog&gt;</span> does most of the work now: focus trap, backdrop, escape. Cheaper than it used to be. Does your site need one at all?'},
    {v:'menu',t:'Dropdown menu',d:'Full ARIA menu semantics and arrow-key navigation. Expensive, and a nav with four items does not need it.'},
    {v:'tabs',t:'Tabs',d:'Well-specified pattern, moderate cost. Useful for case studies with sanitized/full views.'},
    {v:'accordion',t:'Accordion / disclosure',d:'Cheapest real primitive here — <span class="m">&lt;details&gt;</span> plus tokens. Good for the "withheld under employer IP" pattern you already have.'},
    {v:'pager',t:'Pagination / breadcrumb',d:'Only if Field Notes grows past one page. Speculative today.'},
   ]},

  {id:'p-overlay',type:'specimen',
   label:'Overlay strategy for the ones that float.',
   help:'Modal, dropdown and tooltip all need a layer system, an escape hatch, and focus management. This preview is a single stage showing all four floating pieces at once, in the current token language.',
   opts:[
    {v:'native',k:'Platform primitives — <dialog> + popover attribute',tag:'recommended',
     html:`<div class="sp ui"><div class="ovl">
       <div class="dd"><div class="sel">STRATA</div><div>RELIEF</div><div>SHADE</div></div>
       <div class="tip">7.60:1 · AAA</div>
       <div class="scrim"></div>
       <div class="modal"><h5>Discard changes?</h5>
         <p>The seed has been edited. Leaving now loses the frame.</p>
         <div class="mact"><span class="b">Cancel</span><span class="b p">Discard</span></div></div>
       <div class="tst">✓ Palette saved <span class="x">✕</span></div>
     </div></div>`,
     note:'<span class="m">&lt;dialog&gt;</span> gives focus trap, backdrop, escape and top-layer for free. The <span class="m">popover</span> attribute gives light-dismiss and anchoring for menus and tooltips. Zero dependencies, which matches the zero-dependency discipline you already claim elsewhere. <b>Cost:</b> <span class="m">popover</span> and CSS anchor positioning are recent — you need a documented baseline and a fallback story.'},
    {v:'custom',k:'Hand-rolled layer manager',
     html:`<div class="sp ui"><div class="ovl">
       <div class="dd"><div class="sel">STRATA</div><div>RELIEF</div><div>SHADE</div></div>
       <div class="tip">7.60:1 · AAA</div>
       <div class="scrim"></div>
       <div class="modal"><h5>Discard changes?</h5>
         <p>The seed has been edited. Leaving now loses the frame.</p>
         <div class="mact"><span class="b">Cancel</span><span class="b p">Discard</span></div></div>
     </div></div>`,
     note:'Full control over stacking, animation and nesting; works everywhere. <b>Cost:</b> you are re-implementing focus trapping and inert-background handling, which is where nearly every hand-rolled modal fails its audit. Given that accessibility is your positioning, shipping a subtly-wrong focus trap is the worst possible bug to own.'},
    {v:'none',k:'No floating primitives — everything is in flow',
     html:`<div class="sp ui"><div class="fld"><span class="fl">Confirm</span>
       <div style="border-left:2px solid #C4834A;padding-left:14px">
         <div style="font-family:var(--f-tech);font-size:16px;color:#F0EDE4">Discard changes?</div>
         <div style="font-family:Georgia,serif;font-size:13px;line-height:22px;color:#A8A192;margin-top:6px">The seed has been edited. Leaving now loses the frame.</div>
         <div class="mact" style="justify-content:flex-start;margin-top:13px"><span class="b">Cancel</span><span class="b p">Discard</span></div>
       </div></div></div>`,
     note:'Confirmations, errors and disclosures all resolve inline. Genuinely the most accessible option, and it is philosophically consistent with "an interface that hides its own decision boundaries has not removed them" — an inline confirmation <em>is</em> a visible decision boundary. <b>Cost:</b> the system then cannot serve any consumer who needs a modal, which weakens the enterprise-readiness claim you are trying to answer.'},
   ]},

  {id:'p-note',type:'prose',rows:3,label:'Primitive notes.',optional:true},
]},

/* ── 06 · ADAPTERS ───────────────────────────────────────── */
{id:'fw',num:'06',nav:'Adapters',title:'Framework adapters',
 lede:'Custom elements already work in React 19, Vue and Svelte without wrappers — React 19 fixed the prop-and-event problem that made wrappers necessary. So the honest question is not "React or not", it is <b>what is the authoring layer, and who is the consumer</b>. Previews are real usage code.',
 qs:[
  {id:'f-strat',type:'specimen',
   label:'Adapter strategy.',
   opts:[
    {v:'cem',k:'Publish a Custom Elements Manifest, no wrappers',tag:'recommended',cost:'free',
     html:`<div class="sp cd"><span class="c">// custom-elements.json generated from JSDoc — one artifact,</span>
<span class="c">// consumed by every editor, every framework, and by agents.</span>

<span class="c">// React 19 — works today, no wrapper</span>
<span class="k">&lt;vd-system-card</span>
  <span class="t">index</span>=<span class="s">"01"</span>
  <span class="t">kicker</span>=<span class="s">"Agent systems"</span>
  <span class="t">proof</span>=<span class="s">"agents:4|status:running"</span><span class="k">&gt;</span>
  A governed multi-agent organization.
<span class="k">&lt;/vd-system-card&gt;</span>

<span class="c">// Vue, Svelte, Astro, plain HTML — identical</span></div>`,
     note:'One manifest gives you editor autocomplete, generated docs, type definitions, and a machine-readable component contract. <b>And it is on-thesis:</b> a CEM is exactly the "same structure a screen reader walks is the structure an agent parses" argument applied to your own components. <b>Cost:</b> consumers on React 18 or earlier need <span class="m">ref</span> plumbing for non-string props. Document the baseline and move on.'},
    {v:'gen',k:'Generate thin wrappers per framework from the manifest',cost:'free',
     html:`<div class="sp cd"><span class="c">// scripts/gen-wrappers.mjs reads custom-elements.json</span>
<span class="k">import</span> { SystemCard } <span class="k">from</span> <span class="s">'@verdigris/react'</span>;

&lt;<span class="t">SystemCard</span>
  <span class="t">index</span>=<span class="s">"01"</span>
  <span class="t">proof</span>={{ agents: <span class="n">4</span>, status: <span class="s">'running'</span> }}
  <span class="t">onSelect</span>={handleSelect}
/&gt;

<span class="c">// three packages, one generator, one source of truth</span></div>`,
     note:'Idiomatic per framework — real props, real event handlers, real types. <b>Cost:</b> three published packages, three release channels, three sets of peer-dependency ranges, and a generator to maintain. This is the correct answer for a system with external consumers and overkill for one without.'},
    {v:'ports',k:'Hand-written native components per framework',cost:'over',
     html:`<div class="sp cd"><span class="c">// packages/react/SystemCard.tsx      — hand-written</span>
<span class="c">// packages/vue/SystemCard.vue        — hand-written</span>
<span class="c">// packages/svelte/SystemCard.svelte  — hand-written</span>

<span class="c">// 3x the surface. 3x the bugs. 3x the a11y audits.</span>
<span class="c">// Behaviour drifts between them within two releases.</span></div>`,
     note:'Best possible ergonomics in each framework. <b>Cost:</b> triples the maintained surface and guarantees behavioural drift, which is fatal to the AAA claim — you would have to audit accessibility three times per component, forever. I would not do this at any scale you are plausibly operating at.'},
    {v:'none',k:'Nothing — web components are the deliverable',cost:'free',
     html:`<div class="sp cd"><span class="c">// index.html — the only integration story</span>
<span class="k">&lt;script</span> <span class="t">src</span>=<span class="s">"verdigris/verdigris.js"</span> <span class="t">defer</span><span class="k">&gt;&lt;/script&gt;</span>
<span class="k">&lt;link</span> <span class="t">rel</span>=<span class="s">"stylesheet"</span> <span class="t">href</span>=<span class="s">"verdigris/verdigris.css"</span><span class="k">&gt;</span>

<span class="k">&lt;vd-system-card</span> <span class="t">index</span>=<span class="s">"01"</span><span class="k">&gt;</span>…<span class="k">&lt;/vd-system-card&gt;</span>

<span class="c">// zero build, zero dependencies, zero adapters</span></div>`,
     note:'Zero-dependency, zero-build, and platform-native — a defensible position, and the one most consistent with the rest of your work. <b>Cost:</b> it is also indistinguishable from "I did not get to it" unless the docs make the argument explicitly. A CEM is cheap enough that it converts this from a gap into a stance.'},
   ]},

  {id:'f-auth',type:'choice',
   label:'Does the authoring layer stay web components?',
   help:'The real fork. If web components stay canonical, adapters are output. If a framework becomes canonical, the web components become the output — and the zero-dependency claim goes with it.',
   opts:[
    {v:'wc',t:'Web components stay canonical, forever',d:'Platform-native, no framework churn, and it is the only choice consistent with "infrastructure I own." Constrains you to what custom elements do well — which, for a content site and a token system, is nearly everything.'},
    {v:'lit',t:'Move to Lit as the authoring layer, still shipping custom elements',d:'Reactive properties, scoped styles, less hand-rolled lifecycle code. <b>Cost:</b> a runtime dependency — roughly 6KB, but it ends the zero-dependency claim, which is currently load-bearing in how you describe the work.'},
    {v:'react',t:'React becomes canonical; custom elements are generated output',d:'Most employable-looking, least consistent with the rest of your positioning. Also inverts the dependency direction of everything else you have built.'},
   ]},

  {id:'f-pub',type:'choice',
   label:'Distribution.',
   opts:[
    {v:'sub',t:'One package, subpath exports',d:'<span class="m">@verdigris/core</span>, <span class="m">/react</span>, <span class="m">/tokens</span>. One version number, one changelog, one release. Simplest thing that supports adapters later.'},
    {v:'multi',t:'Separate packages per target',d:'Independent versioning. Standard for large systems and clear overhead at this size.'},
    {v:'copy',t:'Not a package — a documented source drop, copy the files in',d:'Zero infrastructure, and honest for a system with one consumer. <b>Cost:</b> no upgrade path, and "npm install" is the first thing an evaluator tries.'},
   ]},

  {id:'f-note',type:'prose',rows:2,label:'Adapter notes.',optional:true},
]},

/* ── 07 · TOKENS ─────────────────────────────────────────── */
{id:'tok',num:'07',nav:'Tokens',title:'Tokens and design tooling',
 lede:'Your tokens are already tiered correctly — primitives, semantic, component, with a stated rule never to skip a tier. That is the hard part and it is done. What is missing is a machine-readable form and a design-tool round trip. The trap is letting a pipeline invert your source of truth: <b>the measured contrast comments in the CSS are documentation that no design tool can hold</b>, and they are part of what makes the system credible.',
 qs:[
  {id:'t-src',type:'specimen',
   label:'Where do tokens actually live?',
   opts:[
    {v:'css',k:'CSS custom properties stay canonical; DTCG JSON is generated from them',tag:'recommended',cost:'free',
     html:`<div class="sp cd"><span class="c">/* verdigris.css — SOURCE. Comments are load-bearing. */</span>
<span class="k">--vd-teal-400</span>: <span class="s">#4FB8AF</span>;  <span class="c">/* </span><span class="n">7.60</span><span class="c">:1 AAA · structure */</span>

<span class="c">// build/tokens.json — GENERATED (DTCG)</span>
{ <span class="s">"color"</span>: { <span class="s">"teal"</span>: { <span class="s">"400"</span>: {
    <span class="s">"$type"</span>: <span class="s">"color"</span>,
    <span class="s">"$value"</span>: <span class="s">"#4FB8AF"</span>,
    <span class="s">"$description"</span>: <span class="s">"7.60:1 AAA · structure"</span>,
    <span class="s">"$extensions"</span>: { <span class="s">"com.verdigris.contrast"</span>: <span class="n">7.60</span> }
}}}</div>`,
     note:'The stylesheet you already hand-tune stays the truth, and a small parser lifts values plus the measured ratio into DTCG for Figma, Penpot and Style Dictionary. Nothing about your authoring changes. <b>Cost:</b> a parser to write and keep working, and the comment format becomes a contract — it has to stay machine-readable.'},
    {v:'json',k:'DTCG JSON canonical; Style Dictionary emits the CSS',cost:'free',
     html:`<div class="sp cd"><span class="c">// tokens/color.json — SOURCE</span>
{ <span class="s">"teal"</span>: { <span class="s">"400"</span>: { <span class="s">"$value"</span>: <span class="s">"#4FB8AF"</span>,
  <span class="s">"$description"</span>: <span class="s">"7.60:1 AAA · structure"</span> }}}

<span class="c">/* verdigris.css — GENERATED. Do not edit. */</span>
<span class="k">--vd-teal-400</span>: <span class="s">#4FB8AF</span>;

<span class="c">/* The 90-line usage-rule comment block has nowhere</span>
<span class="c">   to live. It becomes prose in a separate doc. */</span></div>`,
     note:'The conventional answer, and it makes multi-platform output trivial. <b>Cost, and it is the real one:</b> your CSS is not a token dump — it carries the salience doctrine, the padding-shorthand warning, the contrast-constraint rationale. Generated files cannot hold that, so it gets separated from the values it explains, and it will drift. Read the top 145 lines of <span class="m">verdigris.css</span> before choosing this.'},
    {v:'figma',k:'Figma variables canonical, code generated',cost:'over',
     html:`<div class="sp cd"><span class="c">// Figma variables → REST API → tokens.json → CSS</span>

<span class="c">// Source of truth now lives in a hosted SaaS file.</span>
<span class="c">// No git history. No code review on a colour change.</span>
<span class="c">// Contrast ratios are not computed, not enforced,</span>
<span class="c">// and not visible at the point of edit.</span></div>`,
     note:'Right for a large org with a dedicated design-systems team and many designers. <b>Wrong here on your own terms:</b> it moves the source of truth off infrastructure you own, out of version control, and away from the place the AAA numbers are computed and enforced.'},
   ]},

  {id:'t-name',type:'choice',
   label:'Token naming.',
   opts:[
    {v:'keep',t:'Keep <span class="m">--vd-ink-000</span> / <span class="m">--vd-bone-500</span> / <span class="m">--vd-teal-400</span>',d:'The names are authored — "ink" and "bone" carry the concept in a way "neutral-900" never will. That is character, and character is the point of the whole exercise. Map to dotted paths only at the generated boundary.'},
    {v:'dtcg',t:'Move to DTCG dotted paths — <span class="m">color.ink.000</span>',d:'Tool-friendly and conventional. <b>Cost:</b> loses the authorial voice in the layer where you are most visibly the author, and forces a rename across every file.'},
    {v:'alias',t:'Keep authored names, publish conventional aliases alongside',d:'Both audiences served. <b>Cost:</b> two names per token is a documentation burden and an invitation to use the wrong one.'},
   ]},

  {id:'t-tool',type:'choice',
   label:'Design tool kit — Figma, Penpot, or neither?',
   help:'Worth naming: <b>Penpot is open-source and self-hostable</b>, which lines up with "my own infrastructure" far better than Figma does. It is also a smaller signal on a résumé, because most teams evaluating you use Figma.',
   opts:[
    {v:'figma',t:'Figma kit',d:'What almost every hiring team and collaborator actually uses. Highest practical signal. <b>Cost:</b> hosted, proprietary, and mildly in tension with the rest of your positioning.'},
    {v:'penpot',t:'Penpot kit, self-hosted',d:'Consistent with the thesis, and itself a small proof point — you host your own design tool. <b>Cost:</b> fewer people can open it, so it demonstrates less to the audience that matters most.'},
    {v:'both',t:'Both, generated from the same token export',d:'Only sane if the export is automated, which question one above decides. Otherwise it is two kits to keep in sync by hand.'},
    {v:'neither',t:'Neither — the docs site <em>is</em> the kit',d:'You already have <span class="m">docs/index.html</span> with live swatches and measured ratios. Argue that a live, measured, interactive reference beats a static design file. <b>Cost:</b> a designer cannot assemble a mockup from it, and that is the actual use case a UI kit serves.'},
   ]},

  {id:'t-sync',type:'choice',
   label:'Sync direction.',
   opts:[
    {v:'one',t:'One-way, code → design',d:'Code is truth; the design tool is a mirror that can be regenerated and never edited. Simple, safe, no merge conflicts. <b>Recommended</b> if code stays canonical.'},
    {v:'bi',t:'Bidirectional',d:'Designers can propose token changes from the tool. <b>Cost:</b> conflict resolution on a colour ramp is genuinely unpleasant, and it needs a review gate to stop an un-measured value landing in the palette.'},
    {v:'manual',t:'No sync — the kit is a periodic snapshot, versioned and dated',d:'Honest about what it is. Perfectly adequate for a one-person system, as long as the snapshot says which version it reflects.'},
   ]},

  {id:'t-note',type:'prose',rows:2,label:'Token notes.',optional:true},
]},

/* ── 08 · STATES ─────────────────────────────────────────── */
{id:'states',num:'08',nav:'States',title:'Validation and feedback states',
 lede:'You have <span class="m">--vd-danger</span> and an error border token and nothing else. This is the cheapest of the five scope items and the one with the most character available: a system built around a measurement rail has an obvious, unusual answer for where validation messages go, and an obvious answer for what a loading state looks like.',
 vbar:true,
 qs:[
  {id:'s-err',type:'specimen',
   label:'Where does an inline error live?',
   help:'Both fields are shown together in each preview — one failing, one passing — because a validation system has to make <em>success</em> legible too, and most only handle failure.',
   opts:[
    {v:'rail',k:'In the rail, beside the field',tag:'the on-brand answer',
     html:errSpec('rail'),
     note:'The message sits in a margin column with an accent rule, exactly like the readout rail on the home page. <b>Why it fits:</b> the rail is already the place where the system annotates its own content, so validation is just another reading. It also never reflows the form when a message appears or clears, which is a genuine usability win. <b>Cost:</b> needs a wide container — below roughly 700px it has to collapse to the stacked variant, so you maintain two layouts.'},
    {v:'icon',k:'Below the field, with a status glyph',tag:'conventional',
     html:errSpec('icon'),
     note:'Glyph plus text below the input, red border on the field. Universally understood, works at any width. The glyph means the state does not rely on colour alone, which your AAA posture requires anyway. <b>Cost:</b> unremarkable — correct and invisible.'},
    {v:'text',k:'Below the field, text only',
     html:errSpec('text'),
     note:'Cleanest typographically. <b>Cost:</b> without a glyph, error and success are distinguished by colour and wording alone — the exact single-channel dependency this whole calibration is about. Would need the wording to always carry the state explicitly.'},
   ]},

  {id:'s-load',type:'specimen',
   label:'What does loading look like?',
   opts:[
    {v:'topo',k:'A topolang field, at low opacity, in the content shape',tag:'unmistakably yours',
     html:`<div class="sp st">
       <div class="empfield" data-topo='{"mode":"SHADE","palette":"VERDIGRIS","cellW":7,"cellH":12,"fontSize":11,"opacity":0.5,"seed":20260801}'></div>
       <div class="mt">Loading · field drifting until content resolves</div></div>`,
     note:'The runtime is already loaded, already deterministic, and already respects <span class="m">prefers-reduced-motion</span> by freezing to a seeded frame — which is exactly the behaviour a loading indicator needs. Nothing else in any design system looks like this. <b>Cost:</b> it is decoration that draws the eye, and a skeleton is supposed to suggest the <em>shape</em> of what is coming. Use it for whole-region loads, not for text blocks.'},
    {v:'skel',k:'Shimmer skeleton',tag:'conventional',
     html:`<div class="sp st"><div class="sk"></div><div class="sk w88"></div>
       <div class="sk w70"></div><div class="sk w45"></div>
       <div class="mt">Loading</div></div>`,
     note:'Communicates the shape of incoming content, which is its actual job. <b>Cost:</b> the sweeping gradient is the single most template-looking element in modern UI, and it will be the only animated gradient anywhere in your system.'},
    {v:'quiet',k:'Static blocks, no animation',
     html:`<div class="sp st"><div class="skq"></div><div class="skq" style="width:88%"></div>

const KEY='verdigris-calibration-03';
let A={}, cur=0, storageOK=true, vsim='none';
const fields=[];

function load(){ try{const r=localStorage.getItem(KEY); if(r)A=JSON.parse(r)||{};}catch(e){A={};} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(A)); if(!storageOK){storageOK=true;flag();}}
  catch(e){ if(storageOK){storageOK=false;flag();} } }
function flag(){
  let el=document.getElementById('nosave');
  if(storageOK){ if(el)el.remove(); return; }
  if(el) return;
  el=document.createElement('div'); el.id='nosave';
  el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:200;background:var(--red);color:#1a0c0c;'+
    'font-family:var(--f-mono);font-size:11.5px;padding:9px 16px;text-align:center';
  el.textContent='AUTOSAVE UNAVAILABLE — serve over http://localhost, or export from Output before closing.';
  document.body.appendChild(el);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1700);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,'');

function allQs(){return SECTIONS.filter(s=>s.qs).flatMap(s=>s.qs.map(q=>({s,q})));}
function answered(q){const v=A[q.id];
  if(v===undefined||v===null)return false;
  if(typeof v==='string')return v.trim()!=='';
  if(Array.isArray(v))return v.length>0;
  if(typeof v==='object')return Object.keys(v).length>0;
  return true;}
const req=q=>!q.optional;
function secStats(s){ if(!s.qs)return null; const r=s.qs.filter(req);
  return {done:r.filter(answered).length,total:r.length}; }

/* ── topolang mounting ────────────────────────────────────────
   render() replaces innerHTML wholesale, so every canvas is
   destroyed on navigation. Fields must be stopped first or the
   rAF loops leak and keep drawing into detached canvases. */
function killFields(){
  while(fields.length){ try{fields.pop().stop();}catch(e){} }
}
function mountFields(){
  if(!window.topolang) return;
  const T=window.topolang;
  document.querySelectorAll('[data-topo]').forEach(el=>{
    let cfg={}; try{cfg=JSON.parse(el.getAttribute('data-topo'));}catch(e){return;}
    const cv=document.createElement('canvas');
    cv.setAttribute('aria-hidden','true');
    el.insertBefore(cv,el.firstChild);
    const f=new T.Field(cv,{
      palette:T.palettes[cfg.palette]||T.palettes.VERDIGRIS,
      mode:T.modes[cfg.mode]||T.modes.STRATA,
      cellW:cfg.cellW||9, cellH:cfg.cellH||15, fontSize:cfg.fontSize||13,
      opacity:cfg.opacity==null?0.78:cfg.opacity,
      seed:cfg.seed||20260801
    });
    fields.push(f);
    f.start();
  });
}

/* ── question renderers ──────────────────────────────────── */
function qHTML(q,i){
  const id=q.id; let body='';
  if(q.type==='prose')
    body=`<textarea data-q="${id}" rows="${q.rows||3}" placeholder="${esc(q.ph||'')}">${esc(A[id]||'')}</textarea>`;
  else if(q.type==='choice'){
    const v=A[id];
    body=`<div class="opts">`+q.opts.map(o=>
      `<label class="opt ${v===o.v?'on':''}" data-opt="${id}" data-v="${o.v}"><span class="box"></span>
       <span class="txt"><span class="t">${o.t}</span>${o.d?`<span class="d">${o.d}</span>`:''}</span></label>`).join('')+`</div>`;
  }
  else if(q.type==='multi'){
    const v=Array.isArray(A[id])?A[id]:[];
    body=`<div class="opts">`+q.opts.map(o=>
      `<label class="opt multi ${v.indexOf(o.v)>-1?'on':''}" data-multi="${id}" data-v="${o.v}"><span class="box"></span>
       <span class="txt"><span class="t">${o.t}</span>${o.d?`<span class="d">${o.d}</span>`:''}</span>
       ${v.indexOf(o.v)>-1?`<span class="pill">${v.indexOf(o.v)+1}</span>`:''}</label>`).join('')+`</div>`;
  }
  else if(q.type==='specimen'){
    const v=A[id];
    body=`<div class="spgrid">`+q.opts.map(o=>
      `<div class="spwrap ${v===o.v?'on':''}">
        <div class="sphead" data-opt="${id}" data-v="${o.v}"><span class="box"></span>
          <span class="k">${o.k}</span>
          ${o.cost?`<span class="cost ${o.cost}">${o.cost==='free'?'FREE':o.cost==='paid'?'PAID':'HIGH COST'}</span>`:''}
          ${o.tag?`<span class="tag">${o.tag}</span>`:''}</div>
        <div class="spstage pad0">${o.html}</div>
        ${o.note?`<div class="spnote">${o.note}</div>`:''}
      </div>`).join('')+`</div>`;
  }
  else if(q.type==='dial'){
    const st=dialState(q);
    body=`<div class="dial" data-dial="${id}">
      <div class="dialstage spstage pad0" id="dst-${id}">${dialSpec(q,st)}</div>
      <div class="dialctl">
        ${(q.segs||[]).map(s=>`<div class="dialrow">
          <label>${s.label}</label>
          <div class="dialseg" data-seg="${s.k}">${s.opts.map(o=>
            `<button data-v="${o}" class="${st[s.k]===o?'on':''}">${o.toLowerCase()}</button>`).join('')}</div>
          <output></output></div>`).join('')}
        ${q.ctrls.map(c=>`<div class="dialrow">
          <label>${c.label}</label>
          <input type="range" data-c="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${st[c.k]}">
          <output>${st[c.k]}${c.unit||''}</output></div>`).join('')}
      </div></div>`;
  }
  return `<div class="q" id="q-${id}">
    <div class="q-top"><span class="q-id">${q.optional?'○':String(i).padStart(2,'0')}</span>
    <p class="q-label">${q.label}</p></div>
    ${q.help?`<div class="q-help">${q.help}</div>`:''}
    <div class="q-body">${body}</div></div>`;
}

function dialState(q){
  const st={};
  (q.ctrls||[]).forEach(c=>st[c.k]=c.def);
  (q.segs||[]).forEach(s=>st[s.k]=s.def);
  const saved=A[q.id];
  if(saved&&typeof saved==='object')Object.keys(saved).forEach(k=>{if(k in st)st[k]=saved[k];});
  return st;
}
function dialSpec(q,st){
  if(q.spec==='hero')
    return heroSpec({mode:st.mode,palette:st.palette,m1:st.m1,m2:st.m2,over:st.over,
      scrim:st.scrim,opacity:(st.opacity||62)/100,cellW:8,cellH:13,fontSize:12,label:false});
  return '';
}

/* ── intro ───────────────────────────────────────────────── */
function introHTML(){return `
  <div class="lbl" style="margin-bottom:14px">Measured, not asserted</div>
  <div class="warn bad"><b>The collision measures worse than it looks.</b> Under deuteranopia

    a hue gap of <b>0.4°</b>. They become the <em>same hue</em>, two stops of value apart.
    That is why the rail reads as "one colour, one of which is dimmed" rather than as two
    categories: for a deuteranopic reader it literally is.</div>

  <table class="px">
    <tr><th>Token</th><th>Hex</th><th>On ground</th><th>Hue</th><th>Sat</th><th>Deuter sim</th></tr>

    <tr><td class="sw"><span style="background:#7FA9CE"></span>link · blue</td><td class="n">#7FA9CE</td><td class="n ok">7.31:1</td><td class="n">208°</td><td class="n">0.38</td><td class="n">#9E9ECF · 240.0°</td></tr>
    <tr><td class="sw"><span style="background:#D0CAB8"></span>body · bone-500</td><td class="n">#D0CAB8</td><td class="n ok">11.06:1</td><td class="n">45°</td><td class="n">0.12</td><td class="n">#CCCCB8 · 60.0°</td></tr>

  <div style="font-size:12.5px;color:var(--dim2);line-height:1.6;margin-bottom:8px">

  <dl class="kv">

      them adjacent without a value or space gap."</em></dd>

    <dt>The name</dt>

  <div class="warn"><b>Worth saying once.</b> Those five gaps are real measured against a
