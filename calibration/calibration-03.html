<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verdigris · Calibration 03 — Colour, Hero, Scope</title>
<script src="verdigris/topolang.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   CHROME — same Signal Lab shell as Calibration 02, so this
   reads as the next pass and not a different instrument.
   Deliberately NOT using --vd-* tokens: this page argues
   about those tokens, so it cannot depend on them.
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#161614; --bg-dim:#111110; --bg-hi:#1e1d1b; --bg-sel:#2c2b28;
  --dim:#524e48; --dim2:#8B8478; --bone:#D0CAB8; --bone-b:#E8E2D0; --white:#F0EDE4;
  --blue:#7FA9CE; --lime:#AAFF00; --green:#44BB44; --teal:#4FB8AF;
  --orange:#C4834A; --red:#CC5555;
  --line:#2c2b28; --line-soft:#211f1d;
  --f-sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --f-tech:Bahnschrift,"DIN Alternate","Segoe UI",sans-serif;
  --f-mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --ease:cubic-bezier(.2,.6,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--bone);font-family:var(--f-sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
::selection{background:var(--bg-sel);color:var(--white)}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2)}

#shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
#rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg-dim);
  border-right:1px solid var(--line);padding:20px 0 24px;display:flex;flex-direction:column}
#rail::-webkit-scrollbar{width:7px}#rail::-webkit-scrollbar-thumb{background:var(--bg-sel)}
.rail-head{padding:0 18px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
.rail-title{font-family:var(--f-mono);font-size:12.5px;color:var(--bone-b);letter-spacing:.05em}
.rail-title b{color:var(--lime);font-weight:400}
.rail-sub{font-size:11px;color:var(--dim2);margin-top:5px;line-height:1.45}
.nav-item{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:7px 18px;
  background:none;border:0;cursor:pointer;color:var(--dim2);font-family:var(--f-sans);font-size:13.5px;
  border-left:2px solid transparent;transition:color .15s,background .15s}
.nav-item:hover{color:var(--bone);background:#00000030}
.nav-item.on{color:var(--bone-b);border-left-color:var(--blue);background:#00000040}
.nav-item .n{font-family:var(--f-mono);font-size:10.5px;color:var(--dim2);min-width:16px}
.nav-item.on .n{color:var(--blue)}
.nav-item .ct{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim2)}
.nav-item.done .ct{color:var(--lime)}
.rail-foot{margin-top:auto;padding:14px 18px 0;border-top:1px solid var(--line-soft)}
.bar{height:3px;background:var(--bg-sel);overflow:hidden;margin-bottom:7px}
.bar i{display:block;height:100%;background:var(--lime);width:0;transition:width .4s var(--ease)}
.rail-foot .lbl{display:flex;justify-content:space-between}
.mini{margin-top:11px;display:flex;gap:6px;flex-wrap:wrap}
.mini button{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--dim2);padding:4px 7px;cursor:pointer}
.mini button:hover{color:var(--bone);border-color:var(--dim2)}

#main{padding:0 0 110px;min-width:0}
.wrap{max-width:900px;margin:0 auto;padding:0 40px}

.sec-head{padding:58px 0 26px;margin-bottom:32px;position:relative;border-bottom:1px solid var(--line)}
.sec-head::after{content:"";position:absolute;left:0;bottom:-1px;width:56px;height:1px;background:var(--lime)}
.sec-num{font-family:var(--f-mono);font-size:11px;color:var(--lime);letter-spacing:.18em;margin-bottom:11px;
  display:flex;align-items:center;gap:9px}
.sec-num::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#aaff0038,transparent)}
.sec-title{font-family:var(--f-tech);font-size:38px;line-height:1.05;font-weight:400;color:var(--white);margin:0 0 13px}
.sec-lede{font-size:15.5px;color:var(--bone);max-width:66ch;line-height:1.65;margin:0}
.sec-lede em{color:var(--bone-b);font-style:italic}
.sec-lede code,.q-help code,.spnote code,.warn code{font-family:var(--f-mono);font-size:12.5px;color:var(--orange);
  background:#0000004d;padding:1px 4px}

.q{padding:28px 0;border-bottom:1px solid var(--line-soft)}
.q:last-of-type{border-bottom:0}
.q-top{display:flex;gap:12px;align-items:baseline;margin-bottom:5px}
.q-id{font-family:var(--f-mono);font-size:10px;color:var(--dim2);padding-top:3px;min-width:30px}
.q-label{font-size:17px;color:var(--bone-b);line-height:1.45;font-weight:500;margin:0}
.q-help{font-size:13.5px;color:var(--dim2);line-height:1.6;margin:6px 0 0 42px;max-width:70ch}
.q-help b{color:var(--bone);font-weight:500}
.q-body{margin:16px 0 0 42px}
@media(max-width:820px){.q-help,.q-body{margin-left:0}}

textarea{width:100%;background:var(--bg-dim);border:1px solid var(--line);color:var(--bone-b);
  font-family:var(--f-sans);font-size:14.5px;line-height:1.6;padding:11px 13px;resize:vertical}
textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
textarea::placeholder{color:#6B665E}

.opts{display:flex;flex-direction:column;gap:1px}
.opt{display:flex;gap:12px;padding:12px 14px;background:var(--bg-dim);border:1px solid var(--line-soft);
  cursor:pointer;transition:all .12s;align-items:flex-start}
.opt:hover{border-color:var(--dim2);background:var(--bg-hi)}
.opt.on{border-color:var(--blue);background:#7fa9ce0f}
.opt .box{width:14px;height:14px;border:1px solid var(--dim2);flex-shrink:0;margin-top:4px;position:relative;border-radius:50%}
.opt.multi .box{border-radius:0}
.opt.on .box{border-color:var(--blue)}
.opt.on .box::after{content:"";position:absolute;inset:3px;background:var(--blue);border-radius:50%}
.opt.multi.on .box::after{border-radius:0;inset:2px}
.opt .txt{min-width:0;display:block}
.opt .t{display:block;font-size:14.5px;color:var(--bone-b);line-height:1.45}
.opt .d{display:block;font-size:12.5px;color:var(--dim2);line-height:1.55;margin-top:3px}
.opt .d code{font-family:var(--f-mono);color:var(--orange);font-size:11.5px}
.opt .d b{color:var(--bone);font-weight:500}
.opt .pill{margin-left:auto;flex-shrink:0;font-family:var(--f-mono);font-size:9px;letter-spacing:.07em;
  padding:2px 6px;border:1px solid var(--line);color:var(--dim2);align-self:flex-start;margin-top:3px}

.spgrid{display:grid;gap:14px;grid-template-columns:1fr}
.spwrap{border:1px solid var(--line);background:var(--bg-dim);transition:border-color .15s}
.spwrap:hover{border-color:var(--dim2)}
.spwrap.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.sphead{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;flex-wrap:wrap}
.sphead .box{width:13px;height:13px;border:1px solid var(--dim2);border-radius:50%;position:relative;flex-shrink:0}
.spwrap.on .sphead .box{border-color:var(--blue)}
.spwrap.on .sphead .box::after{content:"";position:absolute;inset:3px;background:var(--blue);border-radius:50%}
.sphead .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;color:var(--bone)}
.spwrap.on .sphead .k{color:var(--bone-b)}
.sphead .cost{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;padding:2px 7px;border:1px solid}
.cost.free{color:var(--lime);border-color:#aaff0040}
.cost.paid{color:var(--orange);border-color:#c4834a55}
.cost.over{color:var(--red);border-color:#cc555555}
.sphead .tag{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;color:var(--dim2);letter-spacing:.05em}
.spnote{font-size:12.5px;color:var(--dim2);padding:10px 12px 12px;line-height:1.55;border-top:1px solid var(--line-soft)}
.spnote b{color:var(--bone);font-weight:500}
.spnote .m{font-family:var(--f-mono);color:var(--bone)}
.spstage{padding:20px;overflow:hidden}
.spstage.tight{padding:0}
.spstage.pad0{padding:0}

.secnav{display:flex;gap:10px;margin-top:42px;padding-top:24px;border-top:1px solid var(--line)}
.btn{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:none;
  border:1px solid var(--line);color:var(--bone);padding:11px 20px;cursor:pointer;transition:all .14s}
.btn:hover{border-color:var(--dim2);background:var(--bg-hi)}
.btn.pri{border-color:var(--blue);color:var(--blue)}
.btn.pri:hover{background:var(--blue);color:#0d1620}
.btn:disabled{opacity:.3;cursor:default}
.spacer{flex:1}

.warn{border-left:2px solid var(--orange);padding:2px 0 2px 16px;margin:24px 0;font-size:14px;
  color:var(--bone);line-height:1.65}
.warn b{color:var(--orange);font-weight:500}
.warn.ok{border-color:var(--lime)}.warn.ok b{color:var(--lime)}
.warn.bad{border-color:var(--red)}.warn.bad b{color:var(--red)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:9px 18px;font-size:14px;margin:22px 0}
.kv dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);padding-top:3px}
.kv dd{margin:0;color:var(--bone)}
.kv dd b{color:var(--lime);font-weight:500;font-family:var(--f-mono)}

table.px{width:100%;border-collapse:collapse;font-size:13px;margin:18px 0}
table.px th{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);
  text-align:left;padding:0 12px 8px 0;font-weight:400;border-bottom:1px solid var(--line)}
table.px td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line-soft);color:var(--bone);vertical-align:top}
table.px td.n{font-family:var(--f-mono);white-space:nowrap}
table.px td.n.over{color:var(--red)}
table.px td.n.ok{color:var(--lime)}
table.px td.n.mid{color:var(--orange)}
table.px td.sw span{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;border:1px solid #ffffff20}

.outbox{background:var(--bg-dim);border:1px solid var(--line);padding:16px;font-family:var(--f-mono);
  font-size:11.5px;line-height:1.65;color:var(--bone);white-space:pre-wrap;max-height:440px;overflow:auto}
.outbox::-webkit-scrollbar{width:8px}.outbox::-webkit-scrollbar-thumb{background:var(--bg-sel)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:var(--lime);color:#141a06;
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;padding:11px 22px;
  transition:transform .3s var(--ease);z-index:99}
.toast.on{transform:translate(-50%,0)}
@media(max-width:900px){#shell{grid-template-columns:1fr}
  #rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .wrap{padding:0 20px}.sec-title{font-size:30px}}

/* ── vision-simulation bar ─────────────────────────────────
   The whole colour argument turns on what survives CVD, so
   the simulator is a first-class control, not a footnote. */
.vbar{position:sticky;top:0;z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:#0e0e0d;border:1px solid var(--line);padding:9px 12px;margin:0 0 22px}
.vbar .lbl{margin-right:2px}
.vbar button{font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--dim2);padding:5px 9px;cursor:pointer;transition:all .12s}
.vbar button:hover{color:var(--bone);border-color:var(--dim2)}
.vbar button.on{color:#141a06;background:var(--lime);border-color:var(--lime)}
.vbar .hint{font-size:11.5px;color:var(--dim2);margin-left:auto}
body.sim-deuter .spstage,body.sim-deuter .swrow{filter:url(#f-deuter)}
body.sim-protan .spstage,body.sim-protan .swrow{filter:url(#f-protan)}
body.sim-gray   .spstage,body.sim-gray   .swrow{filter:grayscale(1)}
#svgf{position:absolute;width:0;height:0;overflow:hidden}

/* ── swatch strip ─────────────────────────────────────────── */
.swrow{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line);margin:16px 0}
.swrow>div{background:#131211;padding:11px 13px;display:flex;gap:11px;align-items:center}
.swrow .chip{width:30px;height:30px;flex-shrink:0;border:1px solid #ffffff18}
.swrow .nm{font-family:var(--f-mono);font-size:11.5px;color:var(--bone-b)}
.swrow .mt{font-family:var(--f-mono);font-size:10px;color:var(--dim2);display:block;margin-top:2px;letter-spacing:.04em}
.swrow .rt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--lime);white-space:nowrap}
.swrow .rt.bad{color:var(--red)}
.swrow .rt.mid{color:var(--orange)}

/* ══════════════════════════════════════════════════════════
   SPECIMENS — each is a scoped miniature of the real site.
   Colours are literal hex, never inherited, so a specimen
   never accidentally shows the palette it is arguing against.
   ══════════════════════════════════════════════════════════ */
.sp{background:#161614;color:#D0CAB8;font-size:14px;font-family:var(--f-sans)}
.sp .mono{font-family:var(--f-mono)}

/* §01 — the rail: the actual collision site */
.rl{padding:22px;display:grid;grid-template-columns:132px 1fr;gap:30px;align-items:start}
.rl .rail{border-right:1px solid #2c2b28;padding-right:15px}
.rl .ro{display:block;margin-bottom:26px}
.rl .ro:last-child{margin-bottom:0}
.rl .rv{display:block;font-family:var(--f-mono);font-size:18px;line-height:15px;font-weight:500;
  font-variant-numeric:tabular-nums}
.rl .rk{display:block;font-family:var(--f-mono);font-size:12px;line-height:15px;text-transform:uppercase;
  letter-spacing:.14em;color:#A8A192;margin-top:8px}
.rl .e{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#A8A192}
.rl h4{font-family:var(--f-tech);font-size:30px;font-weight:400;color:#F0EDE4;margin:12px 0 0;line-height:1.1}
.rl p{font-family:Georgia,serif;font-size:14px;line-height:26px;color:#D0CAB8;margin:14px 0 0;max-width:46ch}
.rl .card{border:1px solid #2c2b28;border-radius:2px;padding:18px;margin-top:22px}
.rl .cx{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#A8A192;
  display:flex;gap:15px;align-items:baseline}
.rl .cx b{font-weight:500}
.rl .ct{font-family:var(--f-tech);font-size:18px;font-weight:500;color:#E8E2D0;margin:10px 0 0}
.rl .pf{margin-top:14px;padding-top:12px;border-top:1px solid #211f1d;font-family:var(--f-mono);font-size:12px;
  letter-spacing:.05em;color:#A8A192;display:flex;gap:26px;flex-wrap:wrap}
.rl .pf b{font-weight:500;font-variant-numeric:tabular-nums}
/* horizontal rail: the ≤860px case, worst-case adjacency */
.rlh{padding:22px}
.rlh .rail{display:flex;gap:30px;flex-wrap:wrap;border-right:0;border-bottom:1px solid #2c2b28;
  padding:0 0 15px;margin-bottom:20px}
.rlh .ro{margin-bottom:0}

/* §02 — hero field */
.hr{position:relative;overflow:hidden;min-height:290px;padding:34px 0 30px;background:#161614}
.hr .fieldbox{position:absolute;inset:0;z-index:0;pointer-events:none}
.hr canvas{position:absolute;inset:0;width:100%;height:100%}
.hr .in{position:relative;z-index:1;padding:0 26px}
.hr .e{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#A8A192}
.hr h3{font-family:var(--f-tech);font-weight:500;color:#F0EDE4;margin:14px 0 0;
  font-size:38px;line-height:41px;letter-spacing:-.02em}
.hr .sub{font-family:Georgia,serif;font-size:14px;line-height:26px;color:#A8A192;margin:18px 0 0;max-width:40ch}
.hr .cap{position:relative;z-index:1;margin:26px 26px 0;padding-left:15px;border-left:1px solid #2c2b28;
  font-family:var(--f-mono);font-size:11px;line-height:15px;color:#A8A192;letter-spacing:.06em;max-width:44ch}
/* scrim treatments for the overrun case */
.hr.sc-none h3{}
.hr.sc-shadow h3{text-shadow:0 0 14px #161614,0 0 7px #161614,0 0 3px #161614}
.hr.sc-plate h3 span{background:#161614;box-decoration-break:clone;-webkit-box-decoration-break:clone;
  padding:2px 6px;margin-left:-6px}
.hr.sc-dim .fieldbox{opacity:.4}

/* §03 — section heads without ordinals */
.hd{padding:24px 26px;background:#161614}
.hd .e{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#A8A192;display:block}
.hd h4{font-family:var(--f-tech);font-size:30px;font-weight:400;color:#F0EDE4;margin:12px 0 0;line-height:1.1}
.hd p{font-family:Georgia,serif;font-size:14px;line-height:26px;color:#D0CAB8;margin:14px 0 0;max-width:48ch}
.hd .rule{height:1px;background:#2c2b28;position:relative;margin-bottom:22px}
.hd .rule i{position:absolute;left:0;top:0;width:60px;height:1px;background:#44BB44}
.hd .rdo{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:#A8A192;text-transform:uppercase;
  display:flex;gap:20px;margin-bottom:14px}
.hd .rdo b{color:#AAFF00;font-weight:500;font-variant-numeric:tabular-nums}

/* §04 — light mode */
.lt{padding:22px;font-family:var(--f-sans)}
.lt .e{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.lt h4{font-family:var(--f-tech);font-size:24px;font-weight:400;margin:11px 0 0;line-height:1.15}
.lt p{font-family:Georgia,serif;font-size:14px;line-height:25px;margin:12px 0 0;max-width:46ch}
.lt .card{border:1px solid;border-radius:2px;padding:15px;margin-top:16px}
.lt .cx{font-family:var(--f-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  display:flex;gap:13px;align-items:baseline}
.lt .ct{font-family:var(--f-tech);font-size:16px;font-weight:500;margin:8px 0 0}
.lt .pf{margin-top:12px;padding-top:10px;border-top:1px solid;font-family:var(--f-mono);font-size:11px;
  display:flex;gap:22px;flex-wrap:wrap}
.lt .pf b{font-variant-numeric:tabular-nums;font-weight:500}
.lt a{text-decoration:none;border-bottom:1px solid}
/* `duo` sits on the SAME element as `lt`, so these must be compound
   selectors, not descendant ones. `.lt .duo` silently never matches. */
.lt.duo{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0}
.lt.duo>div{padding:20px;min-width:0}
@media(max-width:760px){.lt.duo{grid-template-columns:1fr}}

/* §05 — UI primitives */
.ui{padding:20px 22px;background:#161614}
.ui .lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8B8478;
  margin-bottom:12px;display:block}
.ui .fld{margin-bottom:18px}
.ui .fld:last-child{margin-bottom:0}
.ui .fl{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:#A8A192;margin-bottom:8px}
.ui .fh{display:block;font-family:var(--f-mono);font-size:11px;color:#8B8478;margin-top:7px;line-height:15px}
.ui input[type=text],.ui select,.ui textarea{width:100%;font-family:var(--f-mono);font-size:14px;
  color:#E8E2D0;padding:9px 11px;background:#111110;border:1px solid #2c2b28;border-radius:2px}
.ui input::placeholder{color:#6B665E}
.ui input:focus,.ui select:focus{outline:3px solid #AAFF00;outline-offset:2px;border-color:#3a3835}
/* variant: underline */
.ui.v-line input[type=text],.ui.v-line select{background:transparent;border:0;border-bottom:1px solid #3a3835;
  border-radius:0;padding:8px 2px}
.ui.v-line input:focus{outline:0;border-bottom:2px solid #AAFF00;padding-bottom:7px}
/* variant: sunken well */
.ui.v-well input[type=text],.ui.v-well select{background:#0d0d0c;border:1px solid #211f1d;
  box-shadow:inset 0 1px 0 #00000060}
/* checkbox / radio / toggle */
.ui .cr{display:flex;gap:11px;align-items:center;font-family:var(--f-mono);font-size:13px;color:#D0CAB8;
  margin-bottom:10px;cursor:default}
.ui .bx{width:15px;height:15px;border:1px solid #8B8478;flex-shrink:0;position:relative;background:#111110}
.ui .bx.rd{border-radius:50%}
.ui .bx.on{border-color:#AAFF00}
.ui .bx.on::after{content:"";position:absolute;inset:3px;background:#AAFF00}
.ui .bx.rd.on::after{border-radius:50%}
.ui .tg{width:34px;height:17px;border:1px solid #8B8478;position:relative;flex-shrink:0;background:#111110}
.ui .tg i{position:absolute;top:2px;left:2px;width:11px;height:11px;background:#8B8478;transition:all .15s}
.ui .tg.on{border-color:#AAFF00}.ui .tg.on i{left:18px;background:#AAFF00}
/* table */
.ui table{width:100%;border-collapse:collapse;font-size:13px}
.ui th{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#A8A192;
  text-align:left;padding:0 18px 8px 0;font-weight:400;border-bottom:1px solid #2c2b28}
.ui td{padding:8px 18px 8px 0;border-bottom:1px solid #211f1d;color:#D0CAB8;font-family:var(--f-mono);font-size:12.5px}
.ui td.n{color:#AAFF00;font-variant-numeric:tabular-nums;text-align:right;padding-right:0}
.ui.t-zebra tr:nth-child(even) td{background:#111110}
.ui.t-grid table{border:1px solid #2c2b28}
.ui.t-grid td,.ui.t-grid th{border-right:1px solid #211f1d;padding-left:11px}
.ui.t-grid th{padding-top:8px}
/* overlays */
.ui .ovl{position:relative;min-height:150px;border:1px dashed #2c2b28;overflow:hidden}
.ui .scrim{position:absolute;inset:0;background:#0b0b0acc}
.ui .modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100%,300px);
  background:#1e1d1b;border:1px solid #3a3835;border-radius:2px;padding:18px}
.ui .modal h5{font-family:var(--f-tech);font-size:17px;font-weight:500;color:#F0EDE4;margin:0}
.ui .modal p{font-family:Georgia,serif;font-size:13px;line-height:22px;color:#A8A192;margin:9px 0 0}
.ui .mact{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.ui .b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 14px;border:1px solid #2c2b28;color:#D0CAB8;background:none}
.ui .b.p{border-color:#7FA9CE;color:#7FA9CE}
.ui .dd{position:absolute;left:18px;top:18px;width:190px;background:#1e1d1b;border:1px solid #3a3835;border-radius:2px}
.ui .dd div{font-family:var(--f-mono);font-size:12.5px;color:#D0CAB8;padding:8px 11px;border-bottom:1px solid #211f1d}
.ui .dd div:last-child{border-bottom:0}
.ui .dd div.sel{background:#2c2b28;color:#F0EDE4}
.ui .tip{position:absolute;right:18px;top:44px;background:#2c2b28;border:1px solid #3a3835;
  font-family:var(--f-mono);font-size:11.5px;color:#E8E2D0;padding:6px 10px;border-radius:2px}
.ui .tip::after{content:"";position:absolute;top:-4px;right:16px;width:6px;height:6px;background:#2c2b28;
  border-left:1px solid #3a3835;border-top:1px solid #3a3835;transform:rotate(45deg)}
.ui .tst{position:absolute;left:18px;bottom:18px;right:18px;background:#1e1d1b;border-left:2px solid #44BB44;
  padding:11px 13px;font-family:var(--f-mono);font-size:12px;color:#E8E2D0;display:flex;gap:10px;align-items:center}
.ui .tst .x{margin-left:auto;color:#8B8478}

/* §06/07 — code specimens */
.cd{padding:18px 20px;background:#111110;font-family:var(--f-mono);font-size:12.5px;line-height:1.75;
  color:#A8A192;white-space:pre;overflow-x:auto}
.cd .k{color:#7FA9CE}.cd .s{color:#C4834A}.cd .n{color:#AAFF00}.cd .c{color:#524e48}
.cd .t{color:#E8E2D0}.cd .g{color:#44BB44}
.cd::-webkit-scrollbar{height:7px}.cd::-webkit-scrollbar-thumb{background:#2c2b28}

/* §08 — states */
.st{padding:20px 22px;background:#161614}
.st .fld{margin-bottom:16px}
.st .fl{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:#A8A192;margin-bottom:7px}
.st input{width:100%;font-family:var(--f-mono);font-size:14px;color:#E8E2D0;padding:9px 11px;
  background:#111110;border:1px solid #2c2b28;border-radius:2px}
.st .err input{border-color:#CC5555}
.st .ok input{border-color:#44BB44}
.st .em{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;
  line-height:16px;color:#E68C8C}
.st .em.good{color:#44BB44}
.st .em i{font-style:normal;flex-shrink:0}
/* rail-side annotation variant */
.st.v-rail .fld{display:grid;grid-template-columns:1fr 150px;gap:16px;align-items:start}
.st.v-rail .em{margin-top:0;padding-left:11px;border-left:1px solid #CC5555;grid-column:2;align-self:center}
.st.v-rail .em.good{border-left-color:#44BB44}
.st.v-rail .fl{grid-column:1}
.st.v-rail .inw{grid-column:1}
/* skeletons */
.st .sk{height:15px;background:linear-gradient(90deg,#1e1d1b 0%,#2c2b28 50%,#1e1d1b 100%);
  background-size:200% 100%;animation:shim 1.4s linear infinite;margin-bottom:15px;border-radius:1px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.st .sk.w70{width:70%}.st .sk.w45{width:45%}.st .sk.w88{width:88%}
.st .skq{height:15px;background:#1e1d1b;margin-bottom:15px}
.st .rulel{height:1px;background:#211f1d;position:relative;overflow:hidden;margin-bottom:16px}
.st .rulel i{position:absolute;inset:0;width:40%;background:#44BB44;animation:sweep 1.5s var(--ease) infinite}
@keyframes sweep{0%{left:-40%}100%{left:100%}}
.st .mt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8B8478}
/* empty states */
.st .emp{border:1px solid #2c2b28;border-radius:2px;padding:26px;text-align:center}
.st .emp.left{text-align:left}
.st .emp h5{font-family:var(--f-tech);font-size:17px;font-weight:500;color:#E8E2D0;margin:0}
.st .emp p{font-family:Georgia,serif;font-size:13px;line-height:22px;color:#A8A192;margin:8px 0 0}
.st .zr{display:flex;gap:30px;justify-content:center;margin-bottom:18px}
.st .zr.left{justify-content:flex-start}
.st .zr div{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#8B8478}
.st .zr b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;color:#3a3835;margin-bottom:3px;
  font-variant-numeric:tabular-nums}
.st .empfield{position:relative;height:74px;margin-bottom:16px;overflow:hidden}
.st .empfield canvas{position:absolute;inset:0;width:100%;height:100%}

/* ── dial (live slider playground) ─────────────────────────── */
.dial{border:1px solid var(--line);background:var(--bg-dim)}
.dialstage{padding:0;overflow:hidden;border-bottom:1px solid var(--line)}
.dialctl{padding:14px 16px;display:grid;gap:13px}
.dialrow{display:grid;grid-template-columns:150px 1fr 62px;gap:13px;align-items:center}
.dialrow label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2)}
.dialrow output{font-family:var(--f-mono);font-size:12px;color:var(--lime);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--bg-sel);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--lime);
  cursor:pointer;border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--lime);cursor:pointer;border:0;border-radius:0}
input[type=range]:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.dialseg{display:flex;gap:1px;flex-wrap:wrap}
.dialseg button{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--dim2);padding:6px 10px;cursor:pointer}
.dialseg button.on{color:#141a06;background:var(--bone);border-color:var(--bone)}
.dialseg button:hover:not(.on){color:var(--bone);border-color:var(--dim2)}
</style>
