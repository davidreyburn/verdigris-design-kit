<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verdigris · Calibration 05 — Forms, feedback, and the namesake</title>
<style>
/* ══════════════════════════════════════════════════════════
   CHROME — carried from Calibration 02/03/04 unchanged, so
   this reads as the next pass. Deliberately not using --vd-*
   tokens: this page argues about those tokens.
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#161614; --bg-dim:#111110; --bg-hi:#1e1d1b; --bg-sel:#2c2b28;
  --dim:#524e48; --dim2:#8B8478; --bone:#D0CAB8; --bone-b:#E8E2D0; --white:#F0EDE4;
  --blue:#7FA9CE; --lime:#AAFF00; --green:#44BB44; --teal:#4FB8AF;
  --orange:#C4834A; --red:#CC5555;
  --line:#2c2b28; --line-soft:#211f1d;
  --f-sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --f-tech:Bahnschrift,"DIN Alternate","Segoe UI",sans-serif;
  --f-mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --ease:cubic-bezier(.2,.6,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--bone);font-family:var(--f-sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
::selection{background:var(--bg-sel);color:var(--white)}
.lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim2)}

#shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
#rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg-dim);
  border-right:1px solid var(--line);padding:20px 0 24px;display:flex;flex-direction:column}
#rail::-webkit-scrollbar{width:7px}#rail::-webkit-scrollbar-thumb{background:var(--bg-sel)}
.rail-head{padding:0 18px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
.rail-title{font-family:var(--f-mono);font-size:12.5px;color:var(--bone-b);letter-spacing:.05em}
.rail-title b{color:var(--lime);font-weight:400}
.rail-sub{font-size:11px;color:var(--dim2);margin-top:5px;line-height:1.45}
.nav-item{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:7px 18px;
  background:none;border:0;cursor:pointer;color:var(--dim2);font-family:var(--f-sans);font-size:13.5px;
  border-left:2px solid transparent;transition:color .15s,background .15s}
.nav-item:hover{color:var(--bone);background:#00000030}
.nav-item.on{color:var(--bone-b);border-left-color:var(--blue);background:#00000040}
.nav-item .n{font-family:var(--f-mono);font-size:10.5px;color:var(--dim2);min-width:16px}
.nav-item.on .n{color:var(--blue)}
.nav-item .ct{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--dim2)}
.nav-item.done .ct{color:var(--lime)}
.rail-foot{margin-top:auto;padding:14px 18px 0;border-top:1px solid var(--line-soft)}
.bar{height:3px;background:var(--bg-sel);overflow:hidden;margin-bottom:7px}
.bar i{display:block;height:100%;background:var(--lime);width:0;transition:width .4s var(--ease)}
.rail-foot .lbl{display:flex;justify-content:space-between}
.mini{margin-top:11px;display:flex;gap:6px;flex-wrap:wrap}
.mini button{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--dim2);padding:4px 7px;cursor:pointer}
.mini button:hover{color:var(--bone);border-color:var(--dim2)}

#main{padding:0 0 110px;min-width:0}
.wrap{max-width:900px;margin:0 auto;padding:0 40px}

.sec-head{padding:58px 0 26px;margin-bottom:32px;position:relative;border-bottom:1px solid var(--line)}
.sec-head::after{content:"";position:absolute;left:0;bottom:-1px;width:56px;height:1px;background:var(--lime)}
.sec-num{font-family:var(--f-mono);font-size:11px;color:var(--lime);letter-spacing:.18em;margin-bottom:11px;
  display:flex;align-items:center;gap:9px}
.sec-num::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#aaff0038,transparent)}
.sec-title{font-family:var(--f-tech);font-size:38px;line-height:1.05;font-weight:400;color:var(--white);margin:0 0 13px}
.sec-lede{font-size:15.5px;color:var(--bone);max-width:66ch;line-height:1.65;margin:0}
.sec-lede em{color:var(--bone-b);font-style:italic}
.sec-lede code,.q-help code,.spnote code,.warn code,.kv code{font-family:var(--f-mono);font-size:12.5px;
  color:var(--orange);background:#0000004d;padding:1px 4px}

.q{padding:28px 0;border-bottom:1px solid var(--line-soft)}
.q:last-of-type{border-bottom:0}
.q-top{display:flex;gap:12px;align-items:baseline;margin-bottom:5px}
.q-id{font-family:var(--f-mono);font-size:10px;color:var(--dim2);padding-top:3px;min-width:30px}
.q-label{font-size:17px;color:var(--bone-b);line-height:1.45;font-weight:500;margin:0}
.q-help{font-size:13.5px;color:var(--dim2);line-height:1.6;margin:6px 0 0 42px;max-width:70ch}
.q-help b{color:var(--bone);font-weight:500}
.q-body{margin:16px 0 0 42px}
@media(max-width:820px){.q-help,.q-body{margin-left:0}}

textarea{width:100%;background:var(--bg-dim);border:1px solid var(--line);color:var(--bone-b);
  font-family:var(--f-sans);font-size:14.5px;line-height:1.6;padding:11px 13px;resize:vertical}
textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
textarea::placeholder{color:#6B665E}

.opts{display:flex;flex-direction:column;gap:1px}
.opt{display:flex;gap:12px;padding:12px 14px;background:var(--bg-dim);border:1px solid var(--line-soft);
  cursor:pointer;transition:all .12s;align-items:flex-start}
.opt:hover{border-color:var(--dim2);background:var(--bg-hi)}
.opt.on{border-color:var(--blue);background:#7fa9ce0f}
.opt .box{width:14px;height:14px;border:1px solid var(--dim2);flex-shrink:0;margin-top:4px;position:relative;border-radius:50%}
.opt.multi .box{border-radius:0}
.opt.on .box{border-color:var(--blue)}
.opt.on .box::after{content:"";position:absolute;inset:3px;background:var(--blue);border-radius:50%}
.opt.multi.on .box::after{border-radius:0;inset:2px}
.opt .txt{min-width:0;display:block}
.opt .t{display:block;font-size:14.5px;color:var(--bone-b);line-height:1.45}
.opt .d{display:block;font-size:12.5px;color:var(--dim2);line-height:1.55;margin-top:3px}
.opt .d code{font-family:var(--f-mono);color:var(--orange);font-size:11.5px}
.opt .d b{color:var(--bone);font-weight:500}
.opt .pill{margin-left:auto;flex-shrink:0;font-family:var(--f-mono);font-size:9px;letter-spacing:.07em;
  padding:2px 6px;border:1px solid var(--line);color:var(--dim2);align-self:flex-start;margin-top:3px}

.spgrid{display:grid;gap:14px;grid-template-columns:1fr}
.spwrap{border:1px solid var(--line);background:var(--bg-dim);transition:border-color .15s}
.spwrap:hover{border-color:var(--dim2)}
.spwrap.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.sphead{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;flex-wrap:wrap}
.sphead .box{width:13px;height:13px;border:1px solid var(--dim2);border-radius:50%;position:relative;flex-shrink:0}
.spwrap.on .sphead .box{border-color:var(--blue)}
.spwrap.on .sphead .box::after{content:"";position:absolute;inset:3px;background:var(--blue);border-radius:50%}
.sphead .k{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;color:var(--bone)}
.spwrap.on .sphead .k{color:var(--bone-b)}
.sphead .cost{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;padding:2px 7px;border:1px solid}
.cost.free{color:var(--lime);border-color:#aaff0040}
.cost.paid{color:var(--orange);border-color:#c4834a55}
.cost.over{color:var(--red);border-color:#cc555555}
.sphead .tag{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;color:var(--dim2);letter-spacing:.05em}
.spnote{font-size:12.5px;color:var(--dim2);padding:10px 12px 12px;line-height:1.55;border-top:1px solid var(--line-soft)}
.spnote b{color:var(--bone);font-weight:500}
.spnote .m{font-family:var(--f-mono);color:var(--bone)}
.spstage{padding:0;overflow:hidden}

.secnav{display:flex;gap:10px;margin-top:42px;padding-top:24px;border-top:1px solid var(--line)}
.btn{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;background:none;
  border:1px solid var(--line);color:var(--bone);padding:11px 20px;cursor:pointer;transition:all .14s}
.btn:hover{border-color:var(--dim2);background:var(--bg-hi)}
.btn.pri{border-color:var(--blue);color:var(--blue)}
.btn.pri:hover{background:var(--blue);color:#0d1620}
.btn:disabled{opacity:.3;cursor:default}
.spacer{flex:1}

.warn{border-left:2px solid var(--orange);padding:2px 0 2px 16px;margin:24px 0;font-size:14px;
  color:var(--bone);line-height:1.65}
.warn b{color:var(--orange);font-weight:500}
.warn.ok{border-color:var(--lime)}.warn.ok b{color:var(--lime)}
.warn.bad{border-color:var(--red)}.warn.bad b{color:var(--red)}
.warn.forced{border-color:var(--teal)}.warn.forced b{color:var(--teal)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:9px 18px;font-size:14px;margin:22px 0}
.kv dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);padding-top:3px}
.kv dd{margin:0;color:var(--bone)}
.kv dd b{color:var(--lime);font-weight:500;font-family:var(--f-mono)}
.kv dd.set{color:var(--dim2)}
.kv dd.set b{color:var(--bone-b)}

table.px{width:100%;border-collapse:collapse;font-size:13px;margin:18px 0}
table.px th{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);
  text-align:left;padding:0 12px 8px 0;font-weight:400;border-bottom:1px solid var(--line)}
table.px td{padding:8px 12px 8px 0;border-bottom:1px solid var(--line-soft);color:var(--bone);vertical-align:top}
table.px td.n{font-family:var(--f-mono);white-space:nowrap}
table.px td.n.over{color:var(--red)}
table.px td.n.ok{color:var(--lime)}
table.px td.n.mid{color:var(--orange)}
table.px td.sw span{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;border:1px solid #ffffff20}
table.px tr.hi td{background:#aaff000a}

.outbox{background:var(--bg-dim);border:1px solid var(--line);padding:16px;font-family:var(--f-mono);
  font-size:11.5px;line-height:1.65;color:var(--bone);white-space:pre-wrap;max-height:440px;overflow:auto}
.outbox::-webkit-scrollbar{width:8px}.outbox::-webkit-scrollbar-thumb{background:var(--bg-sel)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);background:var(--lime);color:#141a06;
  font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;padding:11px 22px;
  transition:transform .3s var(--ease);z-index:99}
.toast.on{transform:translate(-50%,0)}
@media(max-width:900px){#shell{grid-template-columns:1fr}
  #rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .wrap{padding:0 20px}.sec-title{font-size:30px}}

/* ── vision + ground simulation ────────────────────────────── */
.vbar{position:sticky;top:0;z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:#0e0e0d;border:1px solid var(--line);padding:9px 12px;margin:0 0 22px}
.vbar button{font-family:var(--f-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  background:none;border:1px solid var(--line);color:var(--dim2);padding:5px 9px;cursor:pointer;transition:all .12s}
.vbar button:hover{color:var(--bone);border-color:var(--dim2)}
.vbar button.on{color:#141a06;background:var(--lime);border-color:var(--lime)}
.vbar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}
.vbar .hint{font-size:11.5px;color:var(--dim2);margin-left:auto}
/* .spstage is deliberately NOT in this list. Every specimen stage
   contains a .demo, so filtering both would nest two colour matrices
   and apply the simulation TWICE — overstating every collapse this
   page argues about. One filter, on the innermost stage only. */
body.sim-deuter .swrow,body.sim-deuter .demo{filter:url(#f-deuter)}
body.sim-protan .swrow,body.sim-protan .demo{filter:url(#f-protan)}
body.sim-gray   .swrow,body.sim-gray   .demo{filter:grayscale(1)}
#svgf{position:absolute;width:0;height:0;overflow:hidden}

/* ── swatch strip ─────────────────────────────────────────── */
.swrow{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line);margin:16px 0}
.swrow>div{background:#131211;padding:11px 13px;display:flex;gap:11px;align-items:center}
.swrow .chip{width:30px;height:30px;flex-shrink:0;border:1px solid #ffffff18}
.swrow .nm{font-family:var(--f-mono);font-size:11.5px;color:var(--bone-b)}
.swrow .mt{font-family:var(--f-mono);font-size:10px;color:var(--dim2);display:block;margin-top:2px;letter-spacing:.04em}
.swrow .rt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--lime);white-space:nowrap}
.swrow .rt.bad{color:var(--red)}
.swrow .rt.mid{color:var(--orange)}

/* ── the collapse diagram ─────────────────────────────────── */
.collapse{border:1px solid var(--line);background:var(--bg-dim);padding:20px 22px;margin:20px 0}
.cpair{display:grid;grid-template-columns:1fr 26px 1fr;gap:0;align-items:center;margin:18px 0 0}
.cpair .side{display:flex;align-items:center;gap:10px;padding:11px 13px;background:#131211;border:1px solid var(--line)}
.cpair .arrow{text-align:center;font-family:var(--f-mono);font-size:15px;color:var(--dim2)}
.cpair .chip{width:26px;height:26px;flex-shrink:0;border:1px solid #ffffff18}
.cpair .nm{font-family:var(--f-mono);font-size:11px;color:var(--bone-b);line-height:1.35}
.cpair .nm span{display:block;color:var(--dim2);font-size:10px;margin-top:2px}
.cverdict{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;margin-top:10px;color:var(--red)}
.cverdict.ok{color:var(--lime)}

/* ══════════════════════════════════════════════════════════
   SPECIMENS — every stage renders against a switchable
   ground, because the paper collapse is worse than the ink
   one and judging only on ink would flatter the options.
   ══════════════════════════════════════════════════════════ */
.demo{padding:22px 24px;background:var(--d-bg);color:var(--d-text);font-family:var(--f-sans);font-size:14px}
.demo .dlbl{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--d-muted);margin-bottom:15px;display:block}

/* a field, built the way the real one would be */
.fld{margin-bottom:19px;max-width:44ch}
.fld:last-child{margin-bottom:0}
.fld label{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--d-muted);margin-bottom:7px}
.fld label .rq{color:var(--d-err);margin-left:3px}
.fld label .op{color:var(--d-muted);text-transform:none;letter-spacing:.02em;font-size:10px;margin-left:5px}
.fld .ctl{display:block;width:100%;min-height:44px;background:var(--d-sunk);color:var(--d-text);
  border:1px solid var(--d-rule);border-radius:2px;padding:11px 13px;font-family:var(--f-sans);font-size:14.5px;
  line-height:1.4}
.fld .ctl.empty{color:var(--d-muted)}
.fld.is-invalid .ctl{border-color:var(--d-err);box-shadow:inset 2px 0 0 var(--d-err)}
.fld.is-valid   .ctl{border-color:var(--d-ok)}
.fld.is-warn    .ctl{border-color:var(--d-warn)}
.fld.is-focus   .ctl{outline:3px solid var(--d-focus);outline-offset:1px;border-color:var(--d-focus)}
.fld .msg{display:flex;gap:7px;align-items:flex-start;margin-top:7px;font-size:13px;line-height:1.45}
.fld .msg .g{font-family:var(--f-mono);font-weight:700;flex-shrink:0;line-height:1.45}
.fld .msg.err{color:var(--d-err)}
.fld .msg.ok{color:var(--d-ok)}
.fld .msg.warn{color:var(--d-warn)}
.fld .msg.quiet{color:var(--d-muted)}
.fld .hint{font-size:12.5px;color:var(--d-muted);margin-top:6px;line-height:1.45}

/* error summary block */
.esum{border:1px solid var(--d-err);border-left-width:3px;padding:13px 15px;margin-bottom:22px;max-width:52ch}
.esum .h{font-family:var(--f-tech);font-size:16px;color:var(--d-err);margin:0 0 8px;font-weight:500}
.esum ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
.esum a{color:var(--d-err);text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* the pull-quote specimen */
.qt{padding-left:18px;border-left:2px solid var(--q-rule);max-width:56ch}
.qt blockquote{margin:0;font-size:18px;line-height:28px;color:var(--q-text);font-family:var(--f-sans)}
.qt figcaption{margin-top:9px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;color:var(--d-muted)}
.qt.tinted blockquote{color:var(--q-tint)}
.qt.markonly{border-left-color:var(--q-tint)}
.qt .qmark{font-family:var(--f-tech);font-size:34px;line-height:1;color:var(--q-tint);display:block;margin-bottom:2px}

/* control inventory grid */
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.inv .cell{border:1px solid var(--d-rule);padding:13px;border-radius:2px}
.inv .cell .cn{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--d-muted);margin-bottom:9px;display:block}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:9px;color:var(--d-text)}
.chk:last-child{margin-bottom:0}
.chk i{width:17px;height:17px;border:1px solid var(--d-rule);flex-shrink:0;position:relative;
  background:var(--d-sunk);border-radius:2px}
.chk.rd i{border-radius:50%}
.chk.on i{border-color:var(--d-struct)}
.chk.on i::after{content:"";position:absolute;inset:3px;background:var(--d-struct);border-radius:1px}
.chk.rd.on i::after{border-radius:50%}
.sel{position:relative}
.sel::after{content:"▾";position:absolute;right:13px;top:12px;color:var(--d-muted);font-size:13px;pointer-events:none}

/* skeleton + empty */
.skel{display:block;height:11px;background:var(--d-sunk);border-radius:2px;margin-bottom:9px}
.skel.w1{width:70%}.skel.w2{width:92%}.skel.w3{width:48%}
.zero{font-family:var(--f-mono);font-size:26px;color:var(--d-muted);font-variant-numeric:tabular-nums}
.zerolbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--d-muted);margin-top:4px}
</style>
</head>
<body>

<svg id="svgf" aria-hidden="true"><defs>
  <filter id="f-deuter" color-interpolation-filters="linearRGB">
    <feColorMatrix type="matrix" values="0.2920 0.7054 -0.0003 0 0
                                         0.2934 0.7089  0.0000 0 0
                                        -0.0209 0.0225  1.0000 0 0
                                         0      0       0      1 0"/>
  </filter>
  <filter id="f-protan" color-interpolation-filters="linearRGB">
    <feColorMatrix type="matrix" values="0.1121 0.8853 -0.0005 0 0
                                         0.1127 0.8897 -0.0001 0 0
                                         0.0045 0.0000  1.0019 0 0
                                         0      0       0      1 0"/>
  </filter>
</defs></svg>

<div id="shell">
  <nav id="rail">
    <div class="rail-head">
      <div class="rail-title">calibration <b>05</b></div>
      <div class="rail-sub">Forms, feedback, and the namesake</div>
    </div>
    <div id="nav"></div>
    <div class="rail-foot">
      <div class="bar"><i id="barfill"></i></div>
      <div class="lbl"><span id="pcount">0 / 0</span><span id="ppct">0%</span></div>
      <div class="mini">
        <button id="b-out">Output</button>
        <button id="b-reset">Reset</button>
      </div>
    </div>
  </nav>
  <main id="main"><div class="wrap" id="stage"></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   COLOUR MATH — identical to Calibration 04. Every figure
   quoted on this page is produced by these functions at
   render time, so nothing here is transcribed.
   ═══════════════════════════════════════════════════════════ */
function lin(c){c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function enc(c){c=Math.max(0,Math.min(1,c));
  return Math.round((c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055)*255);}
function rgb(h){h=h.replace('#','');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function hex(a){return '#'+a.map(v=>('0'+Math.round(v).toString(16)).slice(-2)).join('').toUpperCase();}
function lum(h){const c=rgb(h);return 0.2126*lin(c[0])+0.7152*lin(c[1])+0.0722*lin(c[2]);}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05);}
const DEUTER=[[0.2920,0.7054,-0.0003],[0.2934,0.7089,0.0000],[-0.0209,0.0225,1.0000]];
const PROTAN=[[0.1121,0.8853,-0.0005],[0.1127,0.8897,-0.0001],[0.0045,0.0000,1.0019]];
function sim(h,M){const c=rgb(h).map(lin);
  return hex([0,1,2].map(i=>enc(M[i][0]*c[0]+M[i][1]*c[1]+M[i][2]*c[2])));}
function hue(h){const c=rgb(h).map(v=>v/255);
  const mx=Math.max.apply(null,c),mn=Math.min.apply(null,c),d=mx-mn;
  if(!d)return 0;
  let x; if(mx===c[0])x=60*(((c[1]-c[2])/d)%6);
  else if(mx===c[1])x=60*(((c[2]-c[0])/d)+2); else x=60*(((c[0]-c[1])/d)+4);
  return (x+360)%360;}
function hgap(a,b){const d=Math.abs(hue(a)-hue(b));return Math.min(d,360-d);}

/* ═══════════════════════════════════════════════════════════
   TOKENS — read from the shipped stylesheet's values, kept
   here as literals so this page runs standalone.
   ═══════════════════════════════════════════════════════════ */
const INK='#161614', PAPER='#F0EDE4';
const TOK={
  /* ink */
  bone7:'#F0EDE4', bone6:'#E8E2D0', bone5:'#D0CAB8', bone4:'#A8A192',
  green:'#44BB44', blue:'#7FA9CE', lime:'#AAFF00', red4:'#E68C8C', red3:'#CC5555',
  teal4:'#4AACA4', teal5:'#4FB8AF', orange:'#C4834A',
  inkSunk:'#111110', inkRule:'#2c2b28',
  /* paper */
  graph7:'#161614', graph6:'#1E1D1B', graph5:'#2C2A26', graph4:'#47423B',
  fir:'#12551E', slate:'#22506F', citron:'#454F00', oxide:'#8A1F1F',
  chalk:'#ABA492', patina:'#0F4F4A',
  paperSunk:'#FAF8F2', paperRule:'#C2BBA8'
};

/* The two grounds, expressed as the custom properties every
   specimen reads. Switching ground re-renders; it does not
   re-theme by filter, because a filter would lie. */
function groundVars(g, o){
  o=o||{};
  const ink = g!=='paper';
  const V = ink ? {
    '--d-bg':INK, '--d-sunk':TOK.inkSunk, '--d-rule':TOK.inkRule,
    '--d-text':TOK.bone5, '--d-strong':TOK.bone6, '--d-muted':TOK.bone4,
    '--d-err':TOK.red4, '--d-struct':TOK.green, '--d-focus':TOK.lime, '--d-link':TOK.blue
  } : {
    '--d-bg':PAPER, '--d-sunk':TOK.paperSunk, '--d-rule':TOK.paperRule,
    '--d-text':TOK.graph5, '--d-strong':TOK.graph6, '--d-muted':TOK.graph4,
    '--d-err':TOK.oxide, '--d-struct':TOK.fir, '--d-focus':TOK.citron, '--d-link':TOK.slate
  };
  V['--d-ok']   = o.ok   || V['--d-muted'];
  V['--d-warn'] = o.warn || V['--d-muted'];
  V['--q-rule'] = o.qrule|| V['--d-struct'];
  V['--q-text'] = o.qtext|| V['--d-strong'];
  V['--q-tint'] = o.qtint|| V['--d-strong'];
  return Object.keys(V).map(k=>k+':'+V[k]).join(';');
}
const gBg    = g => g==='paper'?PAPER:INK;
const gErr   = g => g==='paper'?TOK.oxide:TOK.red4;
const gOkHue = g => g==='paper'?TOK.fir:TOK.green;
const gLink  = g => g==='paper'?TOK.slate:TOK.blue;
const gMuted = g => g==='paper'?TOK.graph4:TOK.bone4;
const gStrong= g => g==='paper'?TOK.graph6:TOK.bone6;
const gTeal  = g => g==='paper'?TOK.patina:TOK.teal5;

/* ═══════════════════════════════════════════════════════════
   SPECIMEN BUILDERS
   ═══════════════════════════════════════════════════════════ */

/* §01 — a real field in every state the choice produces.
   The success treatment is the variable; everything else is
   held constant so the comparison is about one thing. */
function fieldSpec(g, ok){
  /* ok: {mode:'none'|'achro'|'link'|'hue', colour, glyph, word} */
  const vars = groundVars(g, {ok: ok.colour});
  let validRow;
  if(ok.mode==='none'){
    validRow = `<div class="fld">
      <label for="x2">Email</label>
      <span class="ctl">dave@dreyburn.com</span>
      <div class="msg quiet"><span class="g">·</span><span>no message — the field simply stops objecting</span></div>
    </div>`;
  } else {
    validRow = `<div class="fld is-valid">
      <label for="x2">Email</label>
      <span class="ctl">dave@dreyburn.com</span>
      <div class="msg ok"><span class="g">${ok.glyph}</span><span>${ok.word}</span></div>
    </div>`;
  }
  return `<div class="demo" style="${vars}">
    <span class="dlbl">${g==='paper'?'Paper':'Ink'} · invalid above, valid below</span>
    <div class="fld is-invalid">
      <label for="x1">Full name</label>
      <span class="ctl empty">Enter your name</span>
      <div class="msg err"><span class="g">!</span><span>Enter your name so I know who I am replying to.</span></div>
    </div>
    ${validRow}
  </div>`;
}

/* The collapse diagram: two swatches, simulated, side by side. */
function collapseSpec(a,b,la,lb,M,mlabel){
  const sa=sim(a,M), sb=sim(b,M);
  const gap=hgap(sa,sb), val=ratio(sa,sb);
  const dead = gap<20 && val<3;
  return `<div class="cpair">
    <div class="side"><i class="chip" style="background:${sa}"></i>
      <span class="nm">${la}<span>${a} → ${sa}</span></span></div>
    <div class="arrow">↔</div>
    <div class="side"><i class="chip" style="background:${sb}"></i>
      <span class="nm">${lb}<span>${b} → ${sb}</span></span></div>
  </div>
  <div class="cverdict ${dead?'':'ok'}">${mlabel} · hue gap ${gap.toFixed(1)}° · value ${val.toFixed(2)}:1
    — ${dead?'INDISTINGUISHABLE':'separable by colour alone'}</div>`;
}

/* §02 — the pull-quote, at its real 18px, with teal applied
   three different ways. */
function quoteSpec(g, mode, teal){
  const t = teal || gTeal(g);
  const o = {qtint:t};
  if(mode==='rule')  o.qrule = t;
  if(mode==='text')  { o.qrule = t; o.qtext = t; }
  if(mode==='mark')  o.qrule = g==='paper'?TOK.paperRule:TOK.inkRule;
  const vars = groundVars(g, o);
  const bodyC = mode==='text' ? t : gStrong(g);
  const r = ratio(bodyC, gBg(g));
  const rr = ratio(t, gBg(g));
  return `<div class="demo" style="${vars}">
    <span class="dlbl">${g==='paper'?'Paper':'Ink'} · vd-quote at its real 18px / 28px</span>
    <figure class="qt ${mode==='text'?'tinted':''} ${mode==='mark'?'markonly':''}">
      ${mode==='mark'?'<span class="qmark">&ldquo;</span>':''}
      <blockquote>An interface that hides its own decision boundaries has not
        removed them. It has moved them somewhere you cannot argue with.</blockquote>
      <figcaption>The reason this page exists</figcaption>
    </figure>
    <div style="font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;margin-top:16px;
      color:${r>=7?'#4FB8AF':'#CC5555'}">
      quote text ${r.toFixed(2)}:1 · teal mark ${rr.toFixed(2)}:1 · AAA needs 7:1 at 18px regular</div>
  </div>`;
}

/* §03 — the control inventory, rendered so "which of these"
   is a visual question rather than a list of nouns. */
function inventorySpec(g){
  const vars=groundVars(g);
  return `<div class="demo" style="${vars}">
    <span class="dlbl">${g==='paper'?'Paper':'Ink'} · every control, hairline box, 44px minimum</span>
    <div class="inv">
      <div class="cell"><span class="cn">text · email · url</span>
        <div class="fld" style="margin:0"><span class="ctl empty">you@example.com</span></div></div>
      <div class="cell"><span class="cn">textarea</span>
        <div class="fld" style="margin:0"><span class="ctl empty" style="min-height:72px">What are you working on?</span></div></div>
      <div class="cell"><span class="cn">select</span>
        <div class="fld sel" style="margin:0"><span class="ctl">Consulting enquiry</span></div></div>
      <div class="cell"><span class="cn">checkbox</span>
        <div class="chk on"><i></i>Send me a copy</div>
        <div class="chk"><i></i>Add me to nothing</div></div>
      <div class="cell"><span class="cn">radio</span>
        <div class="chk rd on"><i></i>Consulting</div>
        <div class="chk rd"><i></i>Speaking</div></div>
      <div class="cell"><span class="cn">skeleton · empty</span>
        <span class="skel w2"></span><span class="skel w1"></span><span class="skel w3"></span>
        <div class="zero" style="margin-top:12px">0</div><div class="zerolbl">records</div></div>
    </div>
  </div>`;
}

/* §04 — required vs optional marking, both directions live. */
function markSpec(g, mode){
  const vars=groundVars(g);
  const req = mode==='required';
  const mk = (name,isReq)=>`<div class="fld">
    <label>${name}${ req && isReq ? '<span class="rq">*</span>' :
              (!req && !isReq ? '<span class="op">(optional)</span>' : '')}</label>
    <span class="ctl empty">&nbsp;</span></div>`;
  return `<div class="demo" style="${vars}">
    <span class="dlbl">${g==='paper'?'Paper':'Ink'} · ${req?'mark the required':'mark the optional'}</span>
    ${mk('Name',true)}${mk('Email',true)}${mk('Company',false)}${mk('Message',true)}
    <div class="fld"><div class="hint">${req
      ? 'Three of four carry a mark. The asterisk is doing most of the work and the eye must scan for its absence.'
      : 'One of four carries a mark. The default is “this is needed”, and the exception is stated in a word rather than a symbol.'}</div></div>
  </div>`;
}

/* §04 — error summary vs inline only. */
function summarySpec(g, mode){
  const vars=groundVars(g);
  const summary = mode==='summary' ? `<div class="esum">
      <p class="h">2 fields need attention</p>
      <ul><li><a>Full name — enter your name</a></li>
          <li><a>Email — this address is missing an @</a></li></ul>
    </div>` : '';
  return `<div class="demo" style="${vars}">
    <span class="dlbl">${g==='paper'?'Paper':'Ink'} · after pressing Send with two bad fields</span>
    ${summary}
    <div class="fld is-invalid">
      <label>Full name</label><span class="ctl empty">&nbsp;</span>
      <div class="msg err"><span class="g">!</span><span>Enter your name.</span></div></div>
    <div class="fld is-invalid">
      <label>Email</label><span class="ctl">dave.dreyburn.com</span>
      <div class="msg err"><span class="g">!</span><span>This address is missing an @.</span></div></div>
    <div class="fld"><div class="hint">${mode==='summary'
      ? 'Focus moves to the summary heading on submit. Each entry is a link to its field.'
      : 'Focus moves to the first invalid field on submit. Nothing is repeated.'}</div></div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
   ENGINE — same as Calibration 04, minus the topolang field
   mounting, which this page has no use for.
   ═══════════════════════════════════════════════════════════ */
const KEY='verdigris-calibration-05';
let A={}, cur=0, storageOK=true, vsim='none', ground='ink';

function load(){ try{const r=localStorage.getItem(KEY); if(r)A=JSON.parse(r)||{};}catch(e){A={};} }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(A)); if(!storageOK){storageOK=true;flag();}}
  catch(e){ if(storageOK){storageOK=false;flag();} } }
function flag(){
  let el=document.getElementById('nosave');
  if(storageOK){ if(el)el.remove(); return; }
  if(el) return;
  el=document.createElement('div'); el.id='nosave';
  el.style.cssText='position:fixed;top:0;left:0;right:0;z-index:200;background:var(--red);color:#1a0c0c;'+
    'font-family:var(--f-mono);font-size:11.5px;padding:9px 16px;text-align:center';
  el.textContent='AUTOSAVE UNAVAILABLE — serve over http://localhost, or export from Output before closing.';
  document.body.appendChild(el);
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1700);}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>String(s).replace(/<[^>]+>/g,'');

function allQs(){return SECTIONS.filter(s=>s.qs).flatMap(s=>s.qs.map(q=>({s,q})));}
function answered(q){const v=A[q.id];
  if(v===undefined||v===null)return false;
  if(typeof v==='string')return v.trim()!=='';
  if(Array.isArray(v))return v.length>0;
  if(typeof v==='object')return Object.keys(v).length>0;
  return true;}
const req=q=>!q.optional;
function secStats(s){ if(!s.qs)return null; const r=s.qs.filter(req);
  return {done:r.filter(answered).length,total:r.length}; }

/* ── question renderers ──────────────────────────────────── */
function qHTML(q,i){
  const id=q.id; let body='';
  if(q.type==='prose')
    body=`<textarea data-q="${id}" rows="${q.rows||3}" placeholder="${esc(q.ph||'')}">${esc(A[id]||'')}</textarea>`;
  else if(q.type==='choice'){
    const v=A[id];
    body=`<div class="opts">`+q.opts.map(o=>
      `<label class="opt ${v===o.v?'on':''}" data-opt="${id}" data-v="${o.v}"><span class="box"></span>
       <span class="txt"><span class="t">${o.t}</span>${o.d?`<span class="d">${o.d}</span>`:''}</span></label>`).join('')+`</div>`;
  }
  else if(q.type==='multi'){
    const v=Array.isArray(A[id])?A[id]:[];
    body=`<div class="opts">`+q.opts.map(o=>
      `<label class="opt multi ${v.indexOf(o.v)>-1?'on':''}" data-multi="${id}" data-v="${o.v}"><span class="box"></span>
       <span class="txt"><span class="t">${o.t}</span>${o.d?`<span class="d">${o.d}</span>`:''}</span>
       ${v.indexOf(o.v)>-1?`<span class="pill">${v.indexOf(o.v)+1}</span>`:''}</label>`).join('')+`</div>`;
    if(id==='s-controls') body+=`<div style="margin-top:14px">${inventorySpec(ground)}</div>`;
  }
  else if(q.type==='specimen'){
    const v=A[id];
    body=`<div class="spgrid">`+q.opts.map(o=>{
      /* dyn options render against the currently selected ground,
         so switching ground re-renders rather than re-tints. */
      const stage=o.dyn?o.dyn(ground):o.html;
      return `<div class="spwrap ${v===o.v?'on':''}">
        <div class="sphead" data-opt="${id}" data-v="${o.v}"><span class="box"></span>
          <span class="k">${o.k}</span>
          ${o.cost?`<span class="cost ${o.cost}">${o.cost==='free'?'FREE':o.cost==='paid'?'PAID':'HIGH COST'}</span>`:''}
          ${o.tag?`<span class="tag">${o.tag}</span>`:''}</div>
        <div class="spstage">${stage}</div>
        ${o.note?`<div class="spnote">${o.note}</div>`:''}
      </div>`;}).join('')+`</div>`;
  }

  return `<div class="q" id="q-${id}">
    <div class="q-top"><span class="q-id">${q.optional?'○':String(i).padStart(2,'0')}</span>
    <p class="q-label">${q.label}</p></div>
    ${q.help?`<div class="q-help">${q.help}</div>`:''}
    <div class="q-body">${body}</div></div>`;
}

/* ── intro ───────────────────────────────────────────────── */
function introHTML(){
  const swatch=(h,nm,mt,base,min)=>{
    const v=ratio(h,base), ok=v>=min;
    return `<div><i class="chip" style="background:${h}"></i>
      <span class="nm">${nm}<span class="mt">${h} · ${mt}</span></span>
      <span class="rt ${ok?'':(v>=4.5?'mid':'bad')}">${v.toFixed(2)}:1</span></div>`;
  };
  return `
  <div class="warn bad"><b>Finding 1 — success has no colour available.</b>
    Every conventional success hue collapses against the error colour under dichromat simulation.
    Not "gets close": <b>green 0.7°, lime 0.3°, fir 0.0°, citron 0.0°</b>, all at value ratios
    under 1.05:1. Red-versus-green is the canonical colour-vision failure and this system's own
    tokens reproduce it exactly.</div>

  <div class="collapse">
    <div class="lbl">Error vs success, simulated — computed in this page, not transcribed</div>
    ${collapseSpec(TOK.red4,TOK.green,'error · red-400','success · green-400',DEUTER,'INK · deuteranopia')}
    ${collapseSpec(TOK.oxide,TOK.fir,'error · oxide-500','success · fir-500',DEUTER,'PAPER · deuteranopia')}
    ${collapseSpec(TOK.red4,TOK.blue,'error · red-400','success · blue-400',DEUTER,'INK · deuteranopia, link hue')}
    <div class="axiscap" style="font-size:12.5px;color:var(--dim2);line-height:1.6;margin-top:16px">
      Blue is the only hue that survives against error on <b style="color:var(--bone)">both</b> axes — and it
      is already the link colour. So there is no free hue for success. §01 makes that a choice rather
      than an accident.</div>
  </div>

  <div class="warn forced"><b>Finding 2 — your teal note is measurable, and it nearly works.</b>
    <code>vd-quote</code> renders at <b>18px regular</b>, which is not large text, so it needs the
    full 7:1. <code>--vd-teal-400</code> is <b>6.67:1</b> — the one token in the system that fails
    its own tier and stays. <code>#4FB8AF</code> is <b>7.60:1</b>, and the paper counterpart
    <code>#0F4F4A</code> is <b>8.02:1</b> at <b>0.5°</b> of hue drift. §02 decides how far it goes.</div>

  <div class="swrow" style="grid-template-columns:1fr">
    ${swatch(TOK.teal4,'--vd-teal-400','on ink · current, unassigned',INK,7)}
    ${swatch(TOK.teal5,'--vd-teal-500','on ink · proposed',INK,7)}
    ${swatch(TOK.patina,'--vd-patina-500','on paper · proposed counterpart',PAPER,7)}
  </div>

  <div class="lbl" style="margin:26px 0 14px">Settled in 03 and 04 — not re-asked</div>
  <dl class="kv">
    <dt>Colour</dt><dd class="set">Structure stays <b>green</b>. Link <b>blue</b>. Data <b>lime</b>, numerals only. Separation rule is relative, not absolute: <b>20° of hue or 3:1 of value, or a named non-colour channel</b>.</dd>
    <dt>Light mode</dt><dd class="set">Shipped. Authored paper set, not an inversion. Surfaces move <b>away from the text colour</b>. Toggle is a sun/moon glyph.</dd>
    <dt>Field</dt><dd class="set">SHADE at every width. Drift leftward at <b>11.5–14 cells/sec</b>. Mask alphas <b>0.452</b> ink / <b>0.27</b> paper. 9/9 conformant.</dd>
    <dt>Validation</dt><dd class="set">Error below field with a glyph. Blur, then re-validate on input. Full ARIA. Hairline-box controls. Zebra tables. Skeleton loading. Instrument-reads-zero empty states.</dd>
    <dt>Deferred</dt><dd class="set">Framework adapters, token pipeline, Figma kit, dropdown menu, modal. Recorded in <b>§09 Non-goals</b>, not built.</dd>
  </dl>

  <div class="lbl" style="margin:26px 0 12px">What this page closes</div>
  <table class="px">
    <tr><th>§</th><th>Question</th><th>Why it is being asked now</th></tr>
    <tr class="hi"><td class="n">01</td><td>Success and warning states</td><td>Never asked. Validation needs two new meanings and there is no hue available for either.</td></tr>
    <tr class="hi"><td class="n">02</td><td>Teal</td><td>Your note. The value fails AAA at the size the quote actually renders, so "use teal" implies a token decision.</td></tr>
    <tr><td class="n">03</td><td>Scope</td><td>There are no form controls at all. And §09 argues against speculative primitives, which a form kit for a formless site would be.</td></tr>
    <tr><td class="n">04</td><td>Marking and submit</td><td>03 said "mark exceptions in words" without saying which is the exception.</td></tr>
    <tr><td class="n">05</td><td>Delivery</td><td>Page layout, CEM production, and what order to build in.</td></tr>
  </table>`;
}

function outputHTML(){
  const r=allQs().filter(x=>req(x.q)), done=r.filter(x=>answered(x.q)).length;
  const gaps=r.filter(x=>!answered(x.q));
  return `<div style="display:flex;gap:26px;margin:18px 0 26px">
    <div><div style="font-family:var(--f-mono);font-size:26px;color:var(--white)">${done}/${r.length}</div><div class="lbl">Answered</div></div>
    <div><div style="font-family:var(--f-mono);font-size:26px;color:var(--white)">${Math.round(done/r.length*100)}%</div><div class="lbl">Complete</div></div>
  </div>
  ${gaps.length?`<div class="warn"><b>${gaps.length} unanswered.</b> ${gaps.map(g=>g.s.num+' · '+strip(g.q.label).slice(0,64)).join('<br>')}</div>`
   :`<div class="warn ok"><b>Complete.</b> Copy or download, then hand it back.</div>`}
  <div class="outbox" id="outbox"></div>
  <div style="display:flex;gap:9px;margin-top:14px">
    <button class="btn pri" id="b-copy">Copy</button>
    <button class="btn" id="b-dl">Download</button></div>`;
}

function brief(){
  const L=[];
  L.push('# Verdigris — Calibration 05 brief');
  L.push('');
  L.push('Forms, feedback, and the namesake. Answers below; measured figures recomputed at export.');
  L.push('');
  SECTIONS.filter(s=>s.qs).forEach(s=>{
    L.push('## '+s.num+' · '+s.title);
    L.push('');
    s.qs.forEach(q=>{
      const v=A[q.id];
      if(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length)){
        L.push('- **'+strip(q.label)+'** — _unanswered_'); return;
      }
      L.push('- **'+strip(q.label)+'**');
      if(q.type==='choice'||q.type==='specimen'){
        const o=q.opts.find(x=>x.v===v);
        L.push('  → '+(o?strip(o.t||o.k):v)+'  `['+v+']`');
      } else if(q.type==='multi'){
        v.forEach((x,i)=>{const o=q.opts.find(y=>y.v===x);
          L.push('  '+(i+1)+'. '+(o?strip(o.t):x)+'  `['+x+']`');});
      } else String(v).trim().split('\n').forEach(l=>L.push('  > '+l));
    });
    L.push('');
  });
  L.push('---');
  L.push('');
  L.push('## Measured, at export time');
  L.push('');
  const pair=(a,b,la,lb)=>{
    const d=hgap(sim(a,DEUTER),sim(b,DEUTER)), p=hgap(sim(a,PROTAN),sim(b,PROTAN));
    L.push('- '+la+' `'+a+'` vs '+lb+' `'+b+'` — measured '+hgap(a,b).toFixed(1)+
           '°, deuteranopia **'+d.toFixed(1)+'°**, protanopia **'+p.toFixed(1)+
           '°**, value '+ratio(a,b).toFixed(2)+':1');
  };
  L.push('### Why success has no hue');
  pair(TOK.red4,TOK.green,'ink error','green');
  pair(TOK.red4,TOK.lime,'ink error','lime');
  pair(TOK.red4,TOK.blue,'ink error','blue');
  pair(TOK.oxide,TOK.fir,'paper error','fir');
  pair(TOK.oxide,TOK.slate,'paper error','slate');
  L.push('');
  L.push('### Teal');
  L.push('- `--vd-teal-400` `'+TOK.teal4+'` — **'+ratio(TOK.teal4,INK).toFixed(2)+':1** on ink, fails AAA at 18px');
  L.push('- proposed `'+TOK.teal5+'` — **'+ratio(TOK.teal5,INK).toFixed(2)+':1** on ink');
  L.push('- proposed paper `'+TOK.patina+'` — **'+ratio(TOK.patina,PAPER).toFixed(2)+
         ':1** on paper, '+hgap(TOK.teal5,TOK.patina).toFixed(1)+'° hue drift from the ink value');
  L.push('- teal vs link blue under deuteranopia — **'+hgap(sim(TOK.teal5,DEUTER),sim(TOK.blue,DEUTER)).toFixed(1)+
         '°**: teal must never be the only difference beside a link');
  L.push('');
  L.push('### Warning');
  L.push('- orange `'+TOK.orange+'` — **'+ratio(TOK.orange,INK).toFixed(2)+
         ':1** on ink: non-text only, cannot be a warning message');
  return L.join('\n');
}

function vbarHTML(s){
  return `<div class="vbar">
    <span class="lbl">Vision</span>
    ${[['none','Normal'],['deuter','Deuteranopia'],['protan','Protanopia'],['gray','Greyscale']]
      .map(v=>`<button data-vsim="${v[0]}" class="${vsim===v[0]?'on':''}">${v[1]}</button>`).join('')}
    ${s.ground?`<span class="sep"></span><span class="lbl">Ground</span>
      ${[['ink','Ink'],['paper','Paper']].map(v=>
        `<button data-ground="${v[0]}" class="${ground===v[0]?'on':''}">${v[1]}</button>`).join('')}`:''}
    <span class="hint">Viénot 1999 · applied to every specimen below</span>
  </div>`;
}

function render(){
  const s=SECTIONS[cur], st=document.getElementById('stage');
  let h=`<div class="sec-head"><div class="sec-num">${s.num==='—'?'OUTPUT':'SECTION '+s.num}</div>
    <h1 class="sec-title">${s.title}</h1>${s.lede?`<p class="sec-lede">${s.lede}</p>`:''}</div>`;
  if(s.vbar)h+=vbarHTML(s);
  if(s.intro)h+=introHTML();
  else if(s.output)h+=outputHTML();
  else{let n=0;h+=s.qs.map(q=>{if(!q.optional)n++;return qHTML(q,n);}).join('');}
  h+=`<div class="secnav"><button class="btn" id="b-prev" ${cur===0?'disabled':''}>← Back</button>
    <div class="spacer"></div>
    ${cur<SECTIONS.length-1?`<button class="btn pri" id="b-next">${cur===0?'Begin':'Next'} →</button>`:''}</div>`;
  st.innerHTML=h;
  window.scrollTo({top:0,behavior:'instant'});
  if(s.output){const b=document.getElementById('outbox'); if(b)b.textContent=brief();}
  bind(); renderNav();
}

function renderNav(){
  document.getElementById('nav').innerHTML=SECTIONS.map((s,i)=>{
    const st=secStats(s), done=st&&st.total>0&&st.done===st.total;
    return `<button class="nav-item ${i===cur?'on':''} ${done?'done':''}" data-go="${i}">
      <span class="n">${s.num==='—'?'··':s.num}</span><span>${s.nav}</span>
      ${st?`<span class="ct">${st.done}/${st.total}</span>`:''}</button>`;}).join('');
  const r=allQs().filter(x=>req(x.q)), done=r.filter(x=>answered(x.q)).length;
  const pct=Math.round(done/r.length*100);
  document.getElementById('barfill').style.width=pct+'%';
  document.getElementById('pcount').textContent=done+' / '+r.length;
  document.getElementById('ppct').textContent=pct+'%';
}

function set(k,v){A[k]=v;save();renderNav();}

function bind(){
  const st=document.getElementById('stage');

  st.querySelectorAll('textarea[data-q]').forEach(el=>
    el.addEventListener('input',()=>set(el.dataset.q,el.value)));

  st.querySelectorAll('[data-opt]').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.opt,v=el.dataset.v;
    set(k,A[k]===v?undefined:v);
    const q=allQs().find(x=>x.q.id===k).q;
    if(q.type==='specimen')
      st.querySelectorAll('[data-opt="'+k+'"]').forEach(h=>h.parentElement.classList.toggle('on',h.dataset.v===A[k]));
    else
      st.querySelectorAll('[data-opt="'+k+'"]').forEach(h=>h.classList.toggle('on',h.dataset.v===A[k]));
  }));

  st.querySelectorAll('[data-multi]').forEach(el=>el.addEventListener('click',()=>{
    const k=el.dataset.multi,v=el.dataset.v;
    const c=Array.isArray(A[k])?A[k].slice():[];
    const i=c.indexOf(v); if(i>-1)c.splice(i,1); else c.push(v);
    set(k,c);
    st.querySelectorAll('[data-multi="'+k+'"]').forEach(h=>{
      const on=c.indexOf(h.dataset.v)>-1;
      h.classList.toggle('on',on);
      let pill=h.querySelector('.pill');
      if(on){ if(!pill){pill=document.createElement('span');pill.className='pill';h.appendChild(pill);}
        pill.textContent=c.indexOf(h.dataset.v)+1; }
      else if(pill) pill.remove();
    });
  }));

  st.querySelectorAll('[data-vsim]').forEach(b=>b.addEventListener('click',()=>{
    vsim=b.dataset.vsim;
    document.body.classList.remove('sim-deuter','sim-protan','sim-gray');
    if(vsim!=='none')document.body.classList.add('sim-'+vsim);
    st.querySelectorAll('[data-vsim]').forEach(x=>x.classList.toggle('on',x.dataset.vsim===vsim));
  }));

  /* Ground is a full re-render, not a filter. Re-tinting would
     produce colours the paper theme never actually emits. */
  st.querySelectorAll('[data-ground]').forEach(b=>b.addEventListener('click',()=>{
    ground=b.dataset.ground; render();
  }));

  const p=document.getElementById('b-prev'),n=document.getElementById('b-next');
  if(p)p.addEventListener('click',()=>{if(cur>0){cur--;render();}});
  if(n)n.addEventListener('click',()=>{if(cur<SECTIONS.length-1){cur++;render();}});
  const c=document.getElementById('b-copy');
  if(c)c.addEventListener('click',()=>navigator.clipboard.writeText(brief())
    .then(()=>toast('Copied'),()=>toast('Copy blocked, select manually')));
  const d=document.getElementById('b-dl');
  if(d)d.addEventListener('click',()=>{
    const b=new Blob([brief()],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='verdigris-brief-05.md';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Saved');});
}

document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(!b)return; cur=+b.dataset.go; render();});
document.getElementById('b-out').addEventListener('click',()=>{cur=SECTIONS.length-1;render();});
const rs=document.getElementById('b-reset'); let armed=false;
rs.addEventListener('click',()=>{
  if(!armed){armed=true;rs.textContent='Erase all?';rs.style.color='var(--red)';rs.style.borderColor='var(--red)';
    clearTimeout(rs._t);rs._t=setTimeout(()=>{armed=false;rs.textContent='Reset';rs.style.color='';rs.style.borderColor='';},3500);return;}
  armed=false;rs.textContent='Reset';rs.style.color='';rs.style.borderColor='';
  A={};save();cur=0;render();toast('Erased');});
document.addEventListener('keydown',e=>{
  if(e.target.matches('textarea,input,select'))return;
  if(e.key==='ArrowRight'&&cur<SECTIONS.length-1){cur++;render();}
  if(e.key==='ArrowLeft'&&cur>0){cur--;render();}});

load(); render();
</script>
</body>
</html>
