<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Verdigris">
  <!-- Three contour segments on the page ground: the shape topolang draws,
       reduced until it still reads at 16px. The ground is part of the mark,
       so it holds against light and dark browser chrome alike and does not
       need a prefers-color-scheme variant it could not carry into .ico. -->
  <rect width="32" height="32" rx="5" fill="#161614"/>
  <g fill="#44BB44">
    <rect x="6"  y="9"  width="20" height="3"/>
    <rect x="6"  y="15" width="14" height="3"/>
    <rect x="6"  y="21" width="9"  height="3"/>
  </g>
</svg>
